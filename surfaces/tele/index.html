<!doctype html>
<html lang="en" data-key="alpha">
<head>
<meta charset="utf-8">
<title>Telestrator render · CalGames 2026</title>
<link rel="icon" href="/favicon.svg?l=TR">
<link rel="stylesheet" href="/theme/tokens.css">
<link rel="stylesheet" href="/shared/fonts.css">
<link rel="stylesheet" href="/shared/broadcast.css">
<style>
/* Strokes only, over whatever the switcher has underneath. Never renders the
   frozen frame itself. That's the replay feed's job, not ours. Opened alone
   in a browser it is ink on black, for a luma key (see applyDisplayMode);
   with ?key=fill it draws the backdrop, and the standby lines say what this
   layer is for until somebody draws. */
#ink { position: absolute; inset: 0; z-index: 50; }

#chip {
  position: absolute; left: var(--safe-x); bottom: var(--safe-y); z-index: 51;
  display: none;
}
#chip[data-on] { display: inline-flex; }
</style>
</head>
<body>
<div id="stageWrap"><div id="stage">
  <canvas id="ink" width="1920" height="1080"></canvas>
  <span class="chip chip--accent" id="chip">Analysis</span>
  <!-- Only in fill, a screen that is the whole picture: under OBS or a keyer this layer
       must carry nothing but ink. Under the ink, so a stroke reads over it. -->
  <div class="standby" id="idle" hidden>
    <div class="sb-title">Telestrator</div>
    <div class="sb-tick"></div>
    <div class="sb-line">The analyst&rsquo;s drawings appear here, on top of the replay,
      when somebody draws on the telestrator pad. Nothing is drawn right now.</div>
  </div>
</div></div>

<script type="module">
import { connect, applyDisplayMode, fitStage, startTicker } from '/shared/desk-client.js';
import { StrokeBook, render } from '/shared/telestrator.js';

// Alone in a browser it is ink on black (luma), never a white page: a
// switcher's luma key cuts the black out, as it does for the program. In
// OBS or framed it stays the transparent layer it always was, and ?key=fill
// gives it the backdrop and the words below. See applyDisplayMode.
applyDisplayMode({ alone: 'luma' });
const FILL = document.documentElement.dataset.key === 'fill';
const $ = id => document.getElementById(id);
const desk = connect('tele');

fitStage($('stage'));

const ctx = $('ink').getContext('2d');
const book = new StrokeBook();
window.__tele = { book, desk };
const fadeMs = () => parseFloat(getComputedStyle(document.documentElement)
  .getPropertyValue('--ink-fade')) || 6000;

/**
 * Failure mode that matters: if the tablet drops off Wi-Fi mid-stroke, we hold
 * the last complete stroke and fade it on schedule. We never freeze a
 * half-drawn line on air, and we never blank instantly either.
 */
desk.on('relay:tele', m => {
  switch (m.k) {
    case 'begin': book.begin(m); break;
    case 'pts':   book.append(m.id, m.pts); break;
    case 'meta':  book.meta(m.id, m.meta); break;
    case 'end':   book.end(m.id); break;
    case 'undo':  book.undo(); break;
    case 'clear': book.clear(); break;
  }
});

// A reconnect means we may have missed an 'end'. Anything still open would
// hang around forever, so close it out and let it fade normally.
desk.on('link', up => { if (up) for (const s of book.strokes) if (!s.done) book.end(s.id); });
desk.on('telestrator.clear', () => book.clear());

startTicker(() => {
  const hidden = desk.state?.telestrator?.hidden ?? false;
  book.prune(fadeMs());

  // Says what this is for whenever there is no ink on it, in fill only.
  const quiet = !FILL || (!hidden && !book.empty);
  if ($('idle').hidden !== quiet) $('idle').hidden = quiet;

  if (hidden) { ctx.clearRect(0, 0, 1920, 1080); $('chip').removeAttribute('data-on'); return; }
  render(ctx, book, { fadeMs: fadeMs() });

  // The audience should always know they're looking at opinion, not
  // officiating. Chip comes up with the first stroke, retires with the last.
  const live = !book.empty;
  $('chip').toggleAttribute('data-on', live);
  if (live) {
    const analyst = desk.state?.telestrator?.analyst;
    $('chip').textContent = analyst ? `Analysis · ${analyst}` : 'Analysis';
  }
});
</script>
</body>
</html>
