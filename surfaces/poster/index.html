<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR posters · CalGames 2026</title>
<link rel="icon" href="/favicon.svg?l=QR">
<link rel="stylesheet" href="/theme/tokens.css">
<link rel="stylesheet" href="/shared/fonts.css">
<style>
/* Printed, so black on white: the codes have to scan off a sheet of paper
   taped to a wall in gym lighting, and a purple page eats toner and contrast
   alike. On screen it keeps a dark frame so it reads as a print preview. */
html { background: #2a0835; }
body { margin: 0; font-family: var(--font-cond); color: #111; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  padding: 14px 18px; color: #fff; font-size: 15px; letter-spacing: .06em; }
.bar button, .bar a { font: inherit; font-weight: 700; text-transform: uppercase;
  letter-spacing: .1em; padding: 9px 14px; border: 0; cursor: pointer;
  background: #F0AF00; color: #1B0322; text-decoration: none; }
.bar a { background: #fff; }
.bar .note { opacity: .8; }
.sheet { background: #fff; width: 8.5in; min-height: 11in; margin: 0 auto 24px;
  padding: .55in; box-sizing: border-box; }
.head { text-align: center; border-bottom: 6px solid #F0AF00; padding-bottom: 14px; }
.head .ev { font-size: 22px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; color: #560F6B; }
.head h1 { margin: 6px 0 0; font-size: 44px; line-height: 1.05; }
.tiles { display: grid; gap: .3in; margin-top: .35in; }
.tile { display: grid; grid-template-columns: 2.6in 1fr; gap: .3in; align-items: center;
  border: 3px solid #560F6B; padding: .22in; break-inside: avoid; }
.tile svg { width: 100%; height: auto; display: block; }
.tile h2 { margin: 0 0 6px; font-size: 34px; line-height: 1.05; color: #560F6B; }
.tile p { margin: 0 0 10px; font-size: 19px; line-height: 1.3; font-family: system-ui, sans-serif; }
.tile .url { font-family: ui-monospace, monospace; font-size: 14px; color: #555; word-break: break-all; }
/* One big code on its own sheet, for the doors and the stands. */
.solo .tile { grid-template-columns: 1fr; text-align: center; border-width: 4px; }
.solo .tile svg { width: 5.4in; margin: 0 auto; }
.solo .tile h2 { font-size: 54px; margin-top: 10px; }
.solo .tile p { font-size: 24px; }
.err { color: #fff; padding: 24px; font-size: 18px; }
@media print {
  html { background: #fff; }
  .bar { display: none; }
  .sheet { margin: 0; width: auto; min-height: 0; }
  @page { size: letter portrait; margin: 0; }
}
</style>
</head>
<body>
<div class="bar">
  <button id="print" type="button">Print</button>
  <a href="?">All three</a>
  <a href="?only=gp">Shout-outs only</a>
  <a href="?only=quiz">Trivia only</a>
  <a href="?only=next">Schedule only</a>
  <span class="note">Tape these up at the doors, the stands and the pits. The codes
    use this desk's address on the venue network, so print them from the desk
    machine on event day, after it is plugged in.</span>
</div>
<div class="sheet" id="sheet"></div>

<script type="module">
import { qrSvg } from '/shared/qr.js';

/*
 * The audience's three front doors, as paper.
 *
 * The shout-out form had no QR anywhere: not on a screen, not on a sign, not
 * in the screen list. The only way in was knowing the URL, so the crowd who
 * most wanted to thank a volunteer had no way to find out they could. Trivia
 * puts its code on the program feed and the side screens carry the schedule
 * code, but a phone in the stands is pointed at whatever is in front of it,
 * and a sheet taped to the bleachers is in front of it all day.
 */
const POSTERS = {
  gp: {
    title: 'Send a shout-out',
    line: 'A volunteer who went out of their way, a team that lent you a part, a mentor, the ref crew. Tell the whole gym: the good ones go up on the big screens.',
    path: '/s/gp',
  },
  quiz: {
    title: 'Play crowd trivia',
    line: 'Answer on your phone between matches and climb the leaderboard on the big screen.',
    path: '/s/quiz',
  },
  next: {
    title: 'When do we play?',
    line: 'Your team, your next match, and roughly when, worked out from how fast the field is actually running.',
    path: '/s/next',
  },
};

$('print').onclick = () => window.print();
function $(id) { return document.getElementById(id); }

const only = new URLSearchParams(location.search).get('only');
const list = only && POSTERS[only] ? [only] : Object.keys(POSTERS);

try {
  const { base } = await fetch('/api/urls').then(r => r.json());
  if (!base) throw new Error('no LAN address yet');
  const sheet = $('sheet');
  if (list.length === 1) sheet.classList.add('solo');
  sheet.innerHTML = `
    <div class="head">
      <div class="ev">CalGames 2026</div>
      <h1>Scan with your phone camera</h1>
    </div>
    <div class="tiles">${list.map(k => {
      const p = POSTERS[k];
      const url = `${base}${p.path}`;
      return `<div class="tile">
        <div>${qrSvg(url)}</div>
        <div><h2>${p.title}</h2><p>${p.line}</p><div class="url">${url}</div></div>
      </div>`;
    }).join('')}</div>`;
} catch (err) {
  // A poster printed with the wrong address is worse than no poster: it sends
  // the whole gym to a page that does not load. So no address, no codes.
  $('sheet').outerHTML = `<p class="err">This desk does not know its address on
    the venue network yet (${String(err.message)}). Plug it into the event
    network, wait a few seconds, and reload this page before printing. No
    restart is needed.</p>`;
}
</script>
</body>
</html>
