<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Must match the body's --cg-purple-void, or the browser chrome tints a
     visibly different purple than the page behind it. -->
<meta name="theme-color" content="#0E0113">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CalGames Remote</title>
<link rel="stylesheet" href="/theme/tokens.css">
<link rel="stylesheet" href="/shared/fonts.css">
<style>
/* Phone-first. Dark, because the producer is standing in a dim broadcast
   position; big targets, because they are doing this one-handed while
   watching the field rather than the screen. */
html { -webkit-text-size-adjust: 100%; }
body {
  background-color: var(--cg-purple-void);
  background-image: var(--tex-perf), var(--atmo);
  background-size: var(--tex-perf-size), cover;
  min-height: 100dvh;
  padding: env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 20px);
  -webkit-user-select: none; user-select: none;
  overscroll-behavior-y: contain;
}
.wrap { max-width: 560px; margin: 0 auto; }

header { display: flex; align-items: center; gap: 10px; padding: 14px 4px 10px; }
h1 { margin: 0; font-size: 19px; font-variation-settings: "wdth" 118; }
.dot { width: 10px; height: 10px; clip-path: var(--chamfer); --ch: 3px; background: var(--st-bad); }
.dot[data-up="true"] { background: var(--st-ok); }
.link { margin-left: auto; font-family: var(--font-mono); font-size: 13px; color: var(--cg-white-dim); }

/* ---- now playing ---- */
.now {
  display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center;
  background: var(--cg-purple); background-image: var(--tex-perf);
  background-size: var(--tex-perf-size);
  clip-path: var(--chamfer); --ch: 14px; padding: 14px 16px; margin-bottom: 12px;
}
.now .s { font-family: var(--font-num); font-weight: 900; font-size: 40px; line-height: 1; }
/* Official alliance red/blue fail even the 3:1 large-text floor on the purple
   panel (2.9:1 and 2.1:1). Lightened console-only variants, same as the desk
   and talent views; broadcast surfaces keep the exact official hex as fills. */
.now .s.red { color: var(--st-bad-text); }
.now .s.blue { color: var(--alliance-blue-text); text-align: right; }
.now .mid { text-align: center; }
.now .clk { font-family: var(--font-num); font-weight: 900; font-size: 26px; line-height: 1; color: var(--cg-gold); }
/* Tracking adds a trailing space to every glyph, so centered tracked text
   sits half a track left of center; the indent puts it back. */
.now .ph { font-family: var(--font-cond); font-size: 13px; letter-spacing: .14em; text-indent: .14em;
  text-transform: uppercase; color: var(--cg-white-dim); margin-top: 3px; }
.mname { font-family: var(--font-cond); font-size: 13px; letter-spacing: .1em; text-indent: .1em;
  text-transform: uppercase; color: var(--cg-white-dim); text-align: center; margin: -4px 0 12px; }

section { margin-bottom: 14px; }
h2 { font-family: var(--font-cond); font-weight: 700; font-size: 13px; letter-spacing: .18em;
  text-transform: uppercase; color: var(--cg-white-dim); margin: 0 0 8px 4px; }

.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.grid.three { grid-template-columns: repeat(3, 1fr); }

/* 60px minimum height: this gets pressed with a thumb, in a hurry. */
.b {
  min-height: 60px; padding: 10px 12px; border: 0; cursor: pointer;
  background: var(--cg-purple); color: var(--cg-white);
  clip-path: var(--chamfer); --ch: 11px;
  font-family: var(--font-cond); font-weight: 700; font-size: 15px;
  letter-spacing: .08em; text-transform: uppercase;
  transition: transform 90ms var(--ease-pop), background 90ms linear;
  touch-action: manipulation;
}
.b:active { transform: scale(.95); background: var(--cg-gold); color: var(--cg-black); }
/* Drawn INSIDE the chamfer with a negative offset, because clip-path clips
   outline and box-shadow alike and a ring outside it is silently invisible.
   /s/next already carries the same fix. Without it there was no focus
   indication anywhere on this page, including Start and Abort, for anyone on
   a Bluetooth keyboard or switch access. */
.b:focus-visible, #pin:focus-visible, #unlock:focus-visible {
  outline: 3px solid var(--focus-ring); outline-offset: -6px;
}
.b[data-on="true"] { background: var(--cg-gold); color: var(--cg-black); }
.b small { display: block; font-size: 13px; opacity: .75; letter-spacing: .04em; margin-top: 2px; }
.b--go { background: var(--cg-green); }
.b--warn { background: var(--cg-purple-hi); }
.b--wide { grid-column: 1 / -1; }

#toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom) + 16px);
  background: var(--cg-gold); color: var(--cg-black);
  clip-path: var(--chamfer); --ch: 10px; padding: 10px 20px;
  font-family: var(--font-cond); font-weight: 700; font-size: 13px;
  letter-spacing: .08em; text-transform: uppercase;
  opacity: 0; pointer-events: none; transition: opacity 160ms linear;
  /* Above the PIN gate, which is a full-screen opaque fixed layer at z-index
     50. Without this the "Wrong PIN" toast painted UNDERNEATH it: the operator
     fat-fingered the PIN, tapped Unlock, and saw absolutely nothing happen. */
  z-index: 60;
}
#toast[data-show] { opacity: 1; }
#toast[data-err] { background: var(--st-bad); color: #fff; }

/* ---- PIN gate ---- */
#gate {
  position: fixed; inset: 0; z-index: 50; display: none;
  place-items: center; padding: 24px;
  background: var(--cg-purple-void);
}
#gate[data-show] { display: grid; }
/* The gate covers the page visually; inert makes that true for keyboards and
   screen readers too, instead of letting focus tab through into invisible
   Start/Abort buttons. */
#pin::placeholder { color: var(--cg-white-dim); }
#gate .box { width: 100%; max-width: 340px; text-align: center; }
#gate h2 { font-size: 13px; margin-bottom: 14px; }
#pin {
  width: 100%; box-sizing: border-box; text-align: center;
  font-family: var(--font-num); font-weight: 900; font-size: 34px; letter-spacing: .3em;
  padding: 16px; background: var(--cg-purple); color: var(--cg-white);
  border: 3px solid var(--cg-gold-lo); margin-bottom: 12px;
}
#pin:focus { outline: none; border-color: var(--cg-gold); }
.hint { color: var(--cg-white-dim); font-size: 13px; line-height: 1.6; margin-top: 14px; }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h2>Enter event PIN</h2>
    <!-- type=password masks the PIN from shoulder surfers in a crowded venue;
         inputmode=numeric keeps the digit keypad, same pairing as /signin. -->
    <input id="pin" type="password" inputmode="numeric" autocomplete="off"
      aria-label="Event PIN" placeholder="Event PIN">
    <button class="b b--go b--wide" id="unlock" style="width:100%">Unlock</button>
    <p class="hint">Anyone who can reach this page can drive the broadcast.
      The PIN is set with <code>REMOTE_PIN</code> on the desk.</p>
  </div>
</div>

<div class="wrap">
  <header>
    <span class="dot" id="dot"></span>
    <h1>CalGames Remote</h1>
    <span class="link" id="link">connecting</span>
  </header>

  <div class="now">
    <div class="s red num" id="red">0</div>
    <div class="mid">
      <div class="clk num" id="clk">0:20</div>
      <div class="ph" id="phase">Pre-match</div>
    </div>
    <div class="s blue num" id="blue">0</div>
  </div>
  <div class="mname" id="mname">No match loaded</div>

  <section>
    <h2>Screen</h2>
    <div class="grid">
      <button class="b" data-screen="overview">Overview</button>
      <button class="b" data-screen="match">Match</button>
      <button class="b" data-screen="score">Score</button>
      <button class="b b--warn" data-screen="blank">Blank</button>
      <!-- Every take above holds the screen until Auto releases it. Without
           this button one tap here would freeze the show's automation with no
           way back from the phone. -->
      <button class="b b--wide" data-screen="auto">Auto<small>follow the match</small></button>
    </div>
  </section>

  <section>
    <h2>Match</h2>
    <div class="grid three">
      <button class="b" data-emit="match.preview">Preview</button>
      <!-- Arm, not Prestart: armed flips program to the score bar before the
           countdown; prestart is a field-reset signal nothing here consumes. -->
      <button class="b" data-emit="match.armed">Arm</button>
      <button class="b b--go" data-emit="match.start">Start</button>
      <button class="b" data-emit="match.end">End</button>
      <button class="b" data-emit="match.score_posted">Post score</button>
      <button class="b b--warn" data-emit="match.aborted">Abort</button>
    </div>
  </section>

  <section>
    <!-- The switcher, when there is one, is standing at a camera rather than
         sitting at the desk. -->
    <h2>Cameras</h2>
    <div class="grid" id="sceneGrid"></div>
  </section>

  <section>
    <h2>Replay</h2>
    <div class="grid">
      <button class="b b--go b--wide" id="mark" style="min-height:76px">
        <!-- "sec", not "s": .b uppercases, and a condensed uppercase S reads
             as a 5 ("NOW − 2S" becomes "NOW − 25"). -->
        Mark<small>drops at now − 2 sec</small></button>
    </div>
  </section>

  <section>
    <!-- The one control worth having in a pocket: the producer is standing
         next to the announcer when the music needs to stop, not at the desk. -->
    <h2>House audio <small id="audSrc"></small></h2>
    <div class="grid">
      <button class="b b--go" id="audPlay">Music on</button>
      <button class="b b--warn" id="audPause">Music off</button>
      <button class="b" id="audDuck">Duck</button>
      <button class="b" id="audNext">Skip</button>
    </div>
    <div class="grid" id="audClips" style="margin-top:8px"></div>
  </section>

  <section>
    <h2>Telestrator</h2>
    <div class="grid">
      <button class="b" id="teleClear">Clear ink</button>
      <button class="b b--warn" id="teleHide">Hide</button>
    </div>
  </section>

  <section>
    <h2>Cues</h2>
    <div class="grid" id="cues"></div>
  </section>
</div>

<div id="toast" role="status"></div>

<script type="module">
import { connect, clockDisplay, clockDisplayFor, phaseFor, PHASE_LABEL, startTicker, SCENE_LABEL } from '/shared/desk-client.js';

const $ = id => document.getElementById(id);
const desk = connect('remote');

/**
 * The gate covers the page; `inert` makes the covered page true for keyboards
 * and screen readers too: without it, focus tabbed straight through the
 * opaque overlay into invisible Start and Abort buttons. Focus lands on the
 * PIN field the moment the gate shows, because that is the only thing to do.
 */
function setGate(show) {
  const was = $('gate').hasAttribute('data-show');
  $('gate').toggleAttribute('data-show', show);
  document.querySelector('.wrap')?.toggleAttribute('inert', show);
  if (show && !was) $('pin').focus();
}

let toastTimer = null;
function toast(msg, err = false) {
  const t = $('toast');
  t.textContent = msg;
  t.toggleAttribute('data-err', err);
  t.setAttribute('data-show', '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.removeAttribute('data-show'), 1600);
}

// ---- PIN gate --------------------------------------------------------------
// Reaching this page at all already required the PIN once: the server sends
// an unsigned request to /signin first. A valid session cookie should unlock
// this gate too, rather than making the operator type the PIN a second time.
// The WS-level `authed` flag alone can't tell us that: a socket opened with a
// good cookie is granted write access silently, with no explicit "you're
// signed in" message, so without this check the gate would show every time
// regardless of the cookie.
let sessionAuthed = false;
async function refreshGate() {
  try {
    const status = await fetch('/api/auth/status').then(r => r.json());
    sessionAuthed = !status.required || status.authed;
  } catch { /* keep the last known value; the WS-level gate still covers it */ }
  setGate(desk.needsPin && !desk.authed && !sessionAuthed);
}
desk.on('ready', refreshGate);
desk.on('auth', ok => {
  if (ok) sessionAuthed = true;
  setGate(!ok && !sessionAuthed);
  toast(ok ? 'Unlocked' : 'Wrong PIN', !ok);
  if (ok) { navigator.vibrate?.(30); loadCues(); }
});
desk.on('denied', () => {
  sessionAuthed = false;
  setGate(true);
  toast('PIN required', true);
});
const unlock = () => {
  const pin = $('pin').value.trim();
  // Two doors, one key. The WS auth frame unlocks emits (screens, marks,
  // telestrator), but the Cues section rides HTTP with the session cookie.
  // A desk restart rotates the session, killing the old cookie while the
  // socket happily re-auths. Unlocking must refresh BOTH, or Cues stays a
  // dead panel of stale arm states with no recovery short of a page reload.
  desk.authenticate(pin);
  void fetch('/api/auth', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ pin }),
  }).then(r => { if (r.ok) { sessionAuthed = true; loadCues(); loadAudio(); loadScenes(); } })
    .catch(() => { /* the socket-side toast already reports the failure */ });
};
$('unlock').onclick = unlock;
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

// ---- connection ------------------------------------------------------------
desk.on('link', up => {
  $('dot').dataset.up = String(up);
  $('link').textContent = up ? 'linked' : 'reconnecting...';
});

// ---- live readout ----------------------------------------------------------
desk.on('state', s => {
  $('red').textContent = s.score.red.total;
  $('blue').textContent = s.score.blue.total;
  $('mname').textContent = s.match?.displayName ?? 'No match loaded';
});

startTicker(() => {
  const c = desk.matchClock;
  // The For variants disambiguate a null clock: a finished match reads
  // Final 0:00 here, never Pre-match 0:20.
  $('clk').textContent = clockDisplayFor(desk.state, c);
  $('phase').textContent = PHASE_LABEL[phaseFor(desk.state, c)] ?? '';
});

// ---- actions ---------------------------------------------------------------
const tap = fn => e => {
  e.preventDefault();
  // The honesty gate. desk.emit() silently drops on a closed socket, and this
  // page's whole design assumes the producer is watching the FIELD, not the
  // phone: a success buzz plus a success toast for a press that went nowhere
  // is the worst possible combination. The replay console has the same guard
  // ("'Sent' would be a lie").
  if (!desk.connected) {
    toast('Not connected. Nothing was sent.', true);
    navigator.vibrate?.([40, 60, 40]);   // distinctly not the success buzz
    return;
  }
  if (desk.needsPin && !desk.authed) {
    toast('Locked. Enter the PIN first.', true);
    return;
  }
  navigator.vibrate?.(12);   // confirms the press without looking at the screen
  fn();
};

for (const b of document.querySelectorAll('[data-emit]')) {
  b.onclick = tap(() => {
    desk.emit({ type: b.dataset.emit });
    toast(b.textContent.trim());
  });
}
for (const b of document.querySelectorAll('[data-screen]')) {
  b.onclick = tap(() => {
    desk.emit({ type: 'screen.change', payload: { screen: b.dataset.screen } });
    toast(b.dataset.screen);
  });
}

// The Screen grid shows which one is live, the way Cameras always has: five
// identical buttons told the producer nothing about whether Blank was still
// up without looking at the program feed.
desk.on('state', s => {
  for (const b of document.querySelectorAll('[data-screen]')) {
    const on = b.dataset.screen === 'auto'
      ? s.screenHold === false
      : b.dataset.screen === s.screen;
    b.toggleAttribute('data-on', on);
    b.setAttribute('aria-pressed', String(on));
  }
});

$('mark').onclick = tap(() => {
  const at = (desk.matchClock ?? 0) - 2;
  desk.emit({ type: 'replay.marker', payload: { kind: 'manual', matchClock: at } });
  toast(`Marked ${clockDisplay(at)}`);
});

$('teleClear').onclick = tap(() => { desk.emit({ type: 'telestrator.clear' }); toast('Ink cleared'); });
$('teleHide').onclick = tap(() => { desk.emit({ type: 'telestrator.hide' }); toast('Telestrator hidden'); });

// ---- cameras ---------------------------------------------------------------
// The same control the desk console has. A dedicated switcher may be standing
// at a camera rather than sitting down, and at the floor of the crew range the
// person cutting is the person holding this phone.
// SCENE_LABEL is shared from desk-client.js: two hand-kept copies drifted.

async function loadScenes() {
  try {
    const res = await fetch('/api/scenes');
    if (!res.ok) return;
    const { scenes } = await res.json();
    if (!scenes) return;
    $('sceneGrid').replaceChildren(...Object.entries(scenes).map(([key, name]) => {
      const b = document.createElement('button');
      b.className = 'b';
      b.textContent = SCENE_LABEL[key] ?? key;
      b.dataset.scene = name;
      b.onclick = tap(async () => {
        const r = await fetch('/api/scene', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ scene: name }),
        });
        if (r.ok) toast(b.textContent);
        else toast((await r.json()).error ?? 'Failed', true);
      });
      return b;
    }));
    paintScene(desk.state);
  } catch { /* transient */ }
}

function paintScene(state) {
  for (const b of document.querySelectorAll('#sceneGrid .b')) {
    b.dataset.on = String(b.dataset.scene === (state?.scene ?? null));
  }
}
desk.on('state', paintScene);

// ---- house audio -----------------------------------------------------------
// Same endpoints the desk console uses. Nothing here makes a sound; the house
// player on the music machine does.
let audioState = null;

async function audio(action, body) {
  try {
    const res = await fetch(`/api/audio/${action}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body ?? {}),
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error ?? `HTTP ${res.status}`);
    paintAudio(json);
    return json;
  } catch (err) {
    toast(err.message, true);
    return null;
  }
}

// Success toasts fire when the request RESOLVES, not when the finger lands:
// the optimistic version toasted "Music off" and then, on failure, stacked
// the error under it: two contradictory toasts back to back.
$('audPlay').onclick = tap(async () => { if (await audio('play')) toast('Music on'); });
$('audPause').onclick = tap(async () => { if (await audio('pause')) toast('Music off'); });
$('audNext').onclick = tap(async () => { if (await audio('next')) toast('Skipped'); });
$('audDuck').onclick = tap(async () => {
  const on = !(audioState?.music?.ducked);
  if (await audio('duck', { on })) toast(on ? 'Ducked' : 'Back up');
});

function paintAudio(s) {
  if (!s) return;
  audioState = s;
  const label = { playlist: 'playlist', clip: 'walk-up', console: 'game audio', silent: 'silent' };
  $('audSrc').textContent = label[s.source] ?? '';
  $('audDuck').classList.toggle('b--go', !!s.music?.ducked);

  // Walk-ups only on the phone. A stinger is a desk decision; a walk-up is
  // fired by whoever is standing where they can see the alliance walk out.
  const clips = (s.clips ?? []).filter(c => c.team !== null);
  const box = $('audClips');
  if (box.dataset.n === String(clips.length)) return;
  box.dataset.n = String(clips.length);
  box.replaceChildren(...clips.map(c => {
    const b = document.createElement('button');
    b.className = 'b';
    b.textContent = String(c.team);
    const sub = document.createElement('small');
    sub.textContent = c.label || 'walk-up';
    b.append(sub);
    b.onclick = tap(() => { void audio('clip', { id: c.id }); toast(`Walk-up ${c.team}`); });
    return b;
  }));
}

desk.on('audio.updated', ev => paintAudio(ev.payload));

/** The audio snapshot is a gated read, so it is fetched at the same two moments
 *  cues are: once unlocked, and again after any reconnect. */
async function loadAudio() {
  try {
    const res = await fetch('/api/audio');
    if (res.ok) paintAudio(await res.json());
  } catch { /* transient: the next reconnect refetches */ }
}

// ---- cue arming ------------------------------------------------------------
async function loadCues() {
  try {
    const res = await fetch('/api/cues');
    if (res.status === 401) {
      // The HTTP session is dead (a desk restart rotates it) even though the
      // socket may still be authed. Leaving the old buttons up showed stale
      // arm states that no tap could change; clear them and bring the gate
      // back so re-entering the PIN can refresh the cookie via unlock().
      sessionAuthed = false;
      $('cues').innerHTML = '<p class="hint">Signed out. Enter the PIN to reload cues.</p>';
      setGate(true);
      return;
    }
    if (!res.ok) return;
    const { cues = [] } = await res.json();
    // Built as nodes, not as a string. Cue names come from config.json, which
    // is operator-authored text (the arcade overlay already comments that
    // exactly this is "an on-air HTML injection point"), and interpolating it
    // raw ran it inside the producer's authenticated session.
    $('cues').replaceChildren(...cues.map(c => {
      const b = document.createElement('button');
      b.className = 'b';
      b.dataset.cue = c.id;
      b.dataset.on = String(c.autopilot);
      b.append(document.createTextNode(c.name));
      const small = document.createElement('small');
      small.textContent = c.autopilot
        ? 'armed'
        : `off · would have fired ${Number(c.wouldHaveFired) || 0}×`;
      b.append(small);
      return b;
    }));
    for (const b of document.querySelectorAll('[data-cue]')) {
      b.onclick = tap(async () => {
        const on = b.dataset.on !== 'true';
        try {
          const r = await fetch(`/api/cues/${b.dataset.cue}/${on ? 'arm' : 'disarm'}`, { method: 'POST' });
          if (!r.ok) throw new Error();
          toast(`${b.firstChild.textContent} ${on ? 'armed' : 'disarmed'}`);
        } catch {
          toast('Could not reach the desk. Check the PIN.', true);
        }
        loadCues();
      });
    }
  } catch { /* transient */ }
}
desk.on('link', up => { if (up) { loadCues(); loadAudio(); loadScenes(); } });
loadCues();
loadAudio();
loadScenes();
</script>
</body>
</html>
