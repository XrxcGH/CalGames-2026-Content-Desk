<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>When do we play? · CalGames 2026</title>
<link rel="stylesheet" href="/theme/tokens.css">
<link rel="stylesheet" href="/shared/fonts.css">
<style>
/* The answer to the most-asked question at any FRC event: "when does my
   team play next?" (on the phone that asked it). Estimated times come from
   the pace model (actual cycle times), not the printed schedule. */
/* The base color lives on the root, not just the body. The body is a
   centered 560px column, so anything outside it (either side on a laptop, or
   below it if the list ever runs long) would otherwise show the canvas with
   the atmosphere gradient tiling, which reads as a second, brighter page. */
html { background-color: var(--cg-purple-void); }
html {
  background-color: var(--cg-purple-void);
  background-image: var(--tex-perf), var(--geo), var(--atmo);
  background-size: var(--tex-perf-size), var(--geo-size), cover;
  background-attachment: fixed;
  min-height: 100%;
}
html, body { height: 100%; }
body {
  background: transparent;
  background-repeat: repeat, no-repeat;
  color: var(--cg-white);
  display: flex; flex-direction: column;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  box-sizing: border-box; gap: 14px;
  max-width: 560px; margin: 0 auto;
}
h1 { margin: 0; text-align: center;
  font-family: var(--font-cond); font-weight: 700; font-size: 22px;
  letter-spacing: .22em; text-indent: .22em; text-transform: uppercase; color: var(--cg-gold); }
.tick { width: 180px; height: 3px; margin: 6px auto 0; background: var(--tick); }
.sub { text-align: center; font-family: var(--font-cond); font-size: 14px;
  letter-spacing: .1em; text-transform: uppercase; color: var(--cg-white-dim); min-height: 18px; }

.card { background-color: var(--cg-purple); background-image: var(--tex-perf);
  background-size: var(--tex-perf-size); clip-path: var(--chamfer); --ch: 14px;
  padding: 16px 18px; }
label { display: block; font-family: var(--font-cond); font-weight: 600; font-size: 14px;
  letter-spacing: .14em; text-transform: uppercase; color: var(--cg-white-dim); margin: 0 0 6px; }
.row { display: flex; gap: 10px; }
input { flex: 1; min-width: 0; box-sizing: border-box; padding: 12px 14px; font-size: 18px;
  font-family: var(--font-num); background: var(--cg-purple-lo); color: var(--cg-white);
  border: 2px solid var(--cg-purple-hi); }
/* Chrome's default placeholder gray is under AA on the sunken purple fill. */
input::placeholder { color: var(--cg-white-dim); }
input:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; border-color: var(--cg-gold); }
.btn-go { padding: 12px 20px; border: 0; cursor: pointer;
  clip-path: var(--chamfer); --ch: 10px;
  background: var(--cg-gold); color: var(--cg-black);
  font-family: var(--font-cond); font-weight: 700; font-size: 15px;
  letter-spacing: .1em; text-transform: uppercase; }
/* clip-path clips outline/box-shadow/filter alike, so a ring drawn OUTSIDE
   the chamfer (positive offset) is silently invisible; drawing it inside
   with a negative offset survives the clip. Black holds contrast on this
   gold fill better than the gold-hi focus-ring token would. */
.btn-go:focus-visible { outline: 3px solid var(--cg-black); outline-offset: -6px; }

.m { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
  background-color: var(--cg-purple); background-image: var(--tex-perf);
  background-size: var(--tex-perf-size); clip-path: var(--chamfer); --ch: 12px;
  padding: 14px 16px; margin-bottom: 10px; }
.m[data-mine="true"] { position: relative; }
.m[data-mine="true"]::before { content: ""; position: absolute; top: 0; left: 0; right: 0;
  height: 5px; background: var(--cg-gold); }
.m-name { font-family: var(--font-num); font-weight: 900; font-size: 24px; }
.m-eta { font-family: var(--font-cond); font-weight: 600; font-size: 15px;
  letter-spacing: .06em; text-transform: uppercase; color: var(--cg-gold); text-align: right; }
.m-teams { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap;
  font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 15px; }
/* 19px bold puts these in WCAG's large-text tier, where white on the
   official alliance red clears the 3:1 floor. At 15px it measured 4.38:1
   against a 4.5 requirement, and the alliance colors are not ours to
   change. Bigger chips are easier to hit on a phone anyway. */
.m-teams span { padding: 8px 10px; clip-path: var(--chamfer); --ch: 6px;
  font-size: 19px; font-weight: 700; }
.m-teams .r { background: var(--alliance-red); }
.m-teams .b { background: var(--alliance-blue); }
.m-teams .mine { outline: 2px solid var(--cg-gold); outline-offset: -2px; font-weight: 900; }
.playedhead { font-family: var(--font-cond); font-weight: 700; font-size: 15px;
  letter-spacing: .16em; text-transform: uppercase; color: var(--cg-white-dim);
  margin: 22px 0 8px; }
.played-row { display: flex; align-items: baseline; gap: 12px; }
.played-score { font-family: var(--font-num); font-weight: 900; }
.played-link { margin-left: auto; color: var(--cg-gold); font-weight: 700;
  text-decoration: none; }
.played-pending { margin-left: auto; color: var(--cg-white-dim); font-size: 13px; }
.access-row { display: flex; gap: 10px; align-items: baseline; }
.access-row b { white-space: nowrap; }
.access-row span { color: var(--cg-white-dim); }
.access-ask { color: var(--cg-gold); margin-top: 8px; font-size: 14px; }
.m-side { font-family: var(--font-cond); font-weight: 700; font-size: 14px;
  letter-spacing: .1em; text-transform: uppercase; color: var(--cg-white-dim); }
.hintline { text-align: center; font-family: var(--font-cond); font-size: 13px;
  letter-spacing: .06em; color: var(--cg-white-dim); line-height: 1.5; }
.rankline { text-align: center; font-family: var(--font-cond); font-size: 16px;
  letter-spacing: .08em; text-transform: uppercase; }
.rankline b { font-family: var(--font-num); color: var(--cg-gold); font-size: 20px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
  <div>
    <h1>When do we play?</h1>
    <div class="tick" aria-hidden="true"></div>
  </div>
  <div class="sub" id="now" aria-live="polite">connecting...</div>

  <!-- A real form, so Enter and the phone keyboard's go key follow too. -->
  <form class="card" id="follow">
    <label for="team">Your team number</label>
    <div class="row">
      <input id="team" inputmode="numeric" pattern="[0-9]*" placeholder="846">
      <button class="btn-go" id="go" type="submit">Follow</button>
    </div>
  </form>

  <div class="rankline" id="rank" hidden aria-live="polite"></div>
  <div id="list"></div>
  <!-- The most-asked question after an event, answered during it: where is the
       video of the match we just played. -->
  <div id="played" hidden>
    <h2 class="playedhead">Your matches so far</h2>
    <div id="playedList"></div>
  </div>
  <!-- Findable rather than announced: the person who needs this is deciding
       now, in a loud building, on the phone already in their hand. -->
  <div id="access" hidden>
    <h2 class="playedhead">Around the building</h2>
    <div id="accessList"></div>
  </div>

  <p class="hintline" id="note">Times marked ~ are estimates from how fast matches are
    actually cycling, not the printed schedule.</p>

<script type="module">
const $ = id => document.getElementById(id);
// The 5s poll below repaints every cycle whether or not anything changed.
// Guard the aria-live regions with these so a screen reader announces a
// real change, not the same status line every 5 seconds.
const setText = (el, text) => { if (el.textContent !== text) el.textContent = text; };
const setHTML = (el, html) => { if (el.innerHTML !== html) el.innerHTML = html; };
let team = Number(localStorage.getItem('next.team')) || null;

/**
 * What this team has already played, and the video if there is one.
 *
 * Read from the coverage ledger rather than the publish queue: the queue knows
 * what it was asked to make, and a team asking "where is our match" needs the
 * answer even when the answer is "it has not been cut yet".
 */
async function loadPlayed() {
  const box = $('played');
  if (!team) { box.hidden = true; return; }
  try {
    const res = await fetch(`/api/coverage/team/${team}`);
    if (!res.ok) { box.hidden = true; return; }
    const { rows } = await res.json();
    const done = (rows ?? []).filter(r => r.playedAt);
    box.hidden = done.length === 0;
    $('playedList').replaceChildren(...done.map(r => {
      const el = document.createElement('div');
      el.className = 'card played-row';
      const name = document.createElement('b');
      name.textContent = r.name;
      el.append(name);
      if (r.score) {
        const sc = document.createElement('span');
        sc.className = 'played-score';
        const mine = r.red.includes(team) ? 'red' : 'blue';
        const won = mine === 'red' ? r.score.red > r.score.blue : r.score.blue > r.score.red;
        sc.textContent = `${r.score.red} - ${r.score.blue}${won ? '  W' : ''}`;
        el.append(sc);
      }
      const vid = r.publish?.videoId;
      if (vid) {
        const a = document.createElement('a');
        a.className = 'played-link';
        a.href = `https://youtu.be/${vid}`;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = 'Watch';
        el.append(a);
      } else {
        const pending = document.createElement('span');
        pending.className = 'played-pending';
        // Honest rather than encouraging: a team refreshing a page that says
        // "coming soon" all weekend trusts the next thing it says less.
        pending.textContent = 'video not posted yet';
        el.append(pending);
      }
      return el;
    }));
  } catch { box.hidden = true; }
}
if (team) $('team').value = team;
// And load their played matches, which only ever ran from the submit handler.
// A parent who followed their team yesterday reopened the page and the played
// list with its video links (the page's whole post-match feature) simply
// never appeared until they pressed Follow again.
if (team) void loadPlayed();

$('follow').addEventListener('submit', e => {
  e.preventDefault();
  team = Number($('team').value) || null;
  if (team) localStorage.setItem('next.team', String(team));
  else localStorage.removeItem('next.team');
  poll();
  void loadPlayed();
});

const clock = ts => new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

function paintAccess(a) {
  const box = document.getElementById('access');
  const list = a?.services ?? [];
  box.hidden = list.length === 0;
  if (!list.length) return;
  const rows = list.map(sv => {
    const row = document.createElement('div');
    row.className = 'card access-row';
    const label = document.createElement('b');
    label.textContent = sv.label;
    row.append(label);
    if (sv.detail) {
      const d = document.createElement('span');
      d.textContent = sv.detail;
      row.append(d);
    }
    return row;
  });
  if (a.ask) {
    const ask = document.createElement('div');
    ask.className = 'access-ask';
    ask.textContent = a.ask;
    rows.push(ask);
  }
  document.getElementById('accessList').replaceChildren(...rows);
}

function paint(s) {
  const behind = s.pace?.behindMin;
  const behindText = behind == null || Math.abs(behind) < 2 ? ''
    : behind > 0 ? ` · ${behind} min behind` : ` · ${-behind} min ahead`;
  setText($('now'), s.status
    ? `${s.status.message}${s.status.backAt ? ` · back ~${clock(s.status.backAt)}` : ''}`
    : s.match?.displayName
      ? `Now playing · ${s.match.displayName}${behindText}`
      : 'Waiting for the field');

  paintAccess(s.accessibility);
  const row = (s.rankings ?? []).find(r => r.team === team);
  $('rank').hidden = !row;
  if (row) setHTML($('rank'),
    `Rank <b>${row.rank}</b> · ${row.record} · ${row.rankingPoints} RP`);

  const eta = i => s.pace?.nextStartAt && s.pace?.cycleSec
    ? `~${clock(s.pace.nextStartAt + i * s.pace.cycleSec * 1000)}`
    : (s.upcoming[i]?.time ? clock(Date.parse(s.upcoming[i].time)) : '');

  const chip = (n, cls) =>
    `<span class="${cls}${n === team ? ' mine' : ''}">${n}</span>`;

  // Following a team means their matches, not a scroll of everyone else's.
  // With nobody following, show what actually fits: `trimToFit()` drops from
  // the bottom until the page stops scrolling, so the phone and the laptop
  // each get as many as their screen holds.
  const all = s.upcoming ?? [];
  const isMine = m => team !== null && (m.red.includes(team) || m.blue.includes(team));

  // Keep each match's place in the real queue. The estimate is "next start
  // plus one cycle per position ahead of you", so filtering to one team and
  // then counting from zero would promise every match the next slot.
  const shown = all
    .map((m, queuePos) => ({ m, queuePos }))
    .filter(({ m }) => team === null || isMine(m));

  $('list').innerHTML = shown.map(({ m, queuePos }) => {
    const yours = isMine(m);
    const side = !yours ? '' : m.red.includes(team) ? 'Red alliance' : 'Blue alliance';
    return `
      <div class="m" data-mine="${yours}">
        <span class="m-name num">${esc(m.shortName || m.name)}</span>
        <span class="m-side">${side}</span>
        <span class="m-eta">${eta(queuePos)}</span>
        <span class="m-teams">${m.red.map(n => chip(n, 'r')).join('')}${m.blue.map(n => chip(n, 'b')).join('')}</span>
      </div>`;
  }).join('') || `<p class="hintline">${all.length
    ? `Team ${team} is not in the next ${all.length} matches. You have time.`
    : 'Schedule not published yet.'}</p>`;

  if (team === null) trimToFit();
}

const esc = x => String(x ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

/**
 * Drop matches off the bottom until the page stops scrolling.
 *
 * Only when nobody is following a team. Someone who typed their number wants
 * all of their matches, however many that is; someone who just opened the
 * page wants a glance, and a glance should not scroll.
 */
function trimToFit() {
  const cards = () => [...document.querySelectorAll('#list .m')];
  let guard = 40;
  while (guard-- > 0 && cards().length > 1
      && document.documentElement.scrollHeight > window.innerHeight) {
    cards().at(-1).remove();
  }
}

async function poll() {
  try { paint(await fetch('/api/state').then(r => r.json())); }
  catch { setText($('now'), 'reconnecting...'); }
}
setInterval(poll, 5000);
poll();

// The played list refreshes on its own timer, and a slower one: it changes
// when a video finishes uploading, which is minutes, not seconds. Without
// this a video posted while somebody had the page open never showed up.
setInterval(() => { if (team) void loadPlayed(); }, 60_000);
</script>
</body>
</html>
