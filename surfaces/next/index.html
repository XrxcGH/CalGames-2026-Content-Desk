<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>When do we play? · CalGames 2026</title>
<link rel="icon" href="/favicon.svg?l=N">
<link rel="stylesheet" href="/theme/tokens.css">
<link rel="stylesheet" href="/shared/fonts.css">
<style>
/* The answer to the most-asked question at any FRC event: "when does my
   team play next?" (on the phone that asked it). Estimated times come from
   the pace model (actual cycle times), not the printed schedule. */
/* The base color lives on the root, not just the body. The body is a
   centered 560px column, so anything outside it (either side on a laptop, or
   below it if the list ever runs long) would otherwise show the canvas with
   the atmosphere gradient tiling, which reads as a second, brighter page. */
html { background-color: var(--cg-purple-void); }
html {
  background-color: var(--cg-purple-void);
  background-image: var(--tex-perf), var(--geo), var(--atmo);
  background-size: var(--tex-perf-size), var(--geo-size), cover, cover, cover;
  background-attachment: fixed;
  min-height: 100%;
}
html, body { height: 100%; }
/*
 * Pit-monitor mode, set by /s/watch when this page is mounted as a kiosk.
 *
 * Everything below is sized for a phone at arm's length. On a 1920x1080 pit
 * TV read from across a room it was a 560px column of 13 to 24px text with
 * two thirds of the screen empty. One scale factor on the root, so every
 * length on the page grows together rather than each one being re-tuned, and
 * a wider column so the match rows use the space.
 */
:root[data-kiosk="1"] { font-size: 24px; }
:root[data-kiosk="1"] body { max-width: 1500px; padding: 40px 48px; gap: 28px; }
:root[data-kiosk="1"] h1 { font-size: 48px; }
:root[data-kiosk="1"] .sub { font-size: 26px; }
:root[data-kiosk="1"] .m-name { font-size: 46px; }
:root[data-kiosk="1"] .m-eta { font-size: 30px; }
:root[data-kiosk="1"] .m-teams { font-size: 30px; }
:root[data-kiosk="1"] .al-sep { width: 5px; }
body {
  background: transparent;
  background-repeat: repeat, no-repeat;
  color: var(--cg-white);
  display: flex; flex-direction: column;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  box-sizing: border-box; gap: 14px;
  max-width: 560px; margin: 0 auto;
}
h1 { margin: 0; text-align: center;
  font-family: var(--font-cond); font-weight: 700; font-size: 22px;
  letter-spacing: .22em; text-indent: .22em; text-transform: uppercase; color: var(--cg-gold); }
.tick { width: 180px; height: 3px; margin: 6px auto 0; background: var(--tick); }
.sub { text-align: center; font-family: var(--font-cond); font-size: 14px;
  letter-spacing: .1em; text-transform: uppercase; color: var(--cg-white-dim); min-height: 18px; }

.card { background-color: var(--cg-purple); background-image: var(--tex-perf);
  background-size: var(--tex-perf-size); clip-path: var(--chamfer); --ch: 14px;
  padding: 16px 18px; }
label { display: block; font-family: var(--font-cond); font-weight: 600; font-size: 14px;
  letter-spacing: .14em; text-transform: uppercase; color: var(--cg-white-dim); margin: 0 0 6px; }
.row { display: flex; gap: 10px; }
input { flex: 1; min-width: 0; box-sizing: border-box; padding: 12px 14px; font-size: 18px;
  font-family: var(--font-num); background: var(--cg-purple-lo); color: var(--cg-white);
  border: 2px solid var(--cg-purple-hi); }
/* Chrome's default placeholder gray is under AA on the sunken purple fill. */
input::placeholder { color: var(--cg-white-dim); }
input:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; border-color: var(--cg-gold); }
.btn-go { padding: 12px 20px; border: 0; cursor: pointer;
  clip-path: var(--chamfer); --ch: 10px;
  background: var(--cg-gold); color: var(--cg-black);
  font-family: var(--font-cond); font-weight: 700; font-size: 15px;
  letter-spacing: .1em; text-transform: uppercase; }
/* clip-path clips outline/box-shadow/filter alike, so a ring drawn OUTSIDE
   the chamfer (positive offset) is silently invisible; drawing it inside
   with a negative offset survives the clip. Black holds contrast on this
   gold fill better than the gold-hi focus-ring token would. */
.btn-go:focus-visible { outline: 3px solid var(--cg-black); outline-offset: -6px; }

.m { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
  background-color: var(--cg-purple); background-image: var(--tex-perf);
  background-size: var(--tex-perf-size); clip-path: var(--chamfer); --ch: 12px;
  padding: 14px 16px; margin-bottom: 10px; }
.m[data-mine="true"] { position: relative; }
.m[data-mine="true"]::before { content: ""; position: absolute; top: 0; left: 0; right: 0;
  height: 5px; background: var(--cg-gold); }
.m-name { font-family: var(--font-num); font-weight: 900; font-size: 24px; }
.m-eta { font-family: var(--font-cond); font-weight: 600; font-size: 15px;
  letter-spacing: .06em; text-transform: uppercase; color: var(--cg-gold); text-align: right; }
/* The match playing now is a fact, not an estimate: quiet colour, leaving gold
   for the times that are guesses. */
.m-eta[data-field] { color: var(--cg-white-dim); }
/* A real gap between the alliances, because red-versus-blue is the one thing
   this palette cannot carry alone: red/blue is the most common colour vision
   deficiency, and on the default list (nobody following a team) there is
   nothing else separating the two groups. The gold tick is the same divider
   the alliance overview uses. */
.al-sep { flex: none; width: 3px; align-self: stretch; margin: 0 4px;
  background: var(--cg-gold); }
.m-teams { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap;
  font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 15px; }
/* 19px bold puts these in WCAG's large-text tier, where white on the
   official alliance red clears the 3:1 floor. At 15px it measured 4.38:1
   against a 4.5 requirement, and the alliance colors are not ours to
   change. Bigger chips are easier to hit on a phone anyway. */
.m-teams span { padding: 8px 10px; clip-path: var(--chamfer); --ch: 6px;
  font-size: 19px; font-weight: 700; }
.m-teams .r { background: var(--alliance-red); }
.m-teams .b { background: var(--alliance-blue); }
.m-teams .mine { outline: 2px solid var(--cg-gold); outline-offset: -2px; font-weight: 900; }
.playedhead { font-family: var(--font-cond); font-weight: 700; font-size: 15px;
  letter-spacing: .16em; text-transform: uppercase; color: var(--cg-white-dim);
  margin: 22px 0 8px; }
.played-row { display: flex; align-items: baseline; gap: 12px; }
.played-score { font-family: var(--font-num); font-weight: 900; }
.played-link { margin-left: auto; color: var(--cg-gold); font-weight: 700;
  text-decoration: none; }
.played-pending { margin-left: auto; color: var(--cg-white-dim); font-size: 13px; }
.access-row { display: flex; gap: 10px; align-items: baseline; }
.access-row b { white-space: nowrap; }
.access-row span { color: var(--cg-white-dim); }
.access-ask { color: var(--cg-gold); margin-top: 8px; font-size: 14px; }
.m-side { font-family: var(--font-cond); font-weight: 700; font-size: 14px;
  letter-spacing: .1em; text-transform: uppercase; color: var(--cg-white-dim); }
.hintline { text-align: center; font-family: var(--font-cond); font-size: 13px;
  letter-spacing: .06em; color: var(--cg-white-dim); line-height: 1.5; }
/* Deliberately quiet: an obligation honoured, not a banner. */
.queue-credit { text-align: center; font-family: var(--font-cond); font-size: 12px;
  letter-spacing: .06em; color: var(--cg-white-dim); margin: 14px 0 0; }
.queue-credit a { color: inherit; }
.rankline { text-align: center; font-family: var(--font-cond); font-size: 16px;
  letter-spacing: .08em; text-transform: uppercase; }
.rankline b { font-family: var(--font-num); color: var(--cg-gold); font-size: 20px; }
.rankline span { display: block; }
[hidden] { display: none !important; }

/* The safety message, as a banner. The venue screens and the program overlay
   take the whole frame; a phone cannot, because the page under it is still the
   thing somebody is trying to use, so this sits on top of it and stays on
   screen while the page scrolls. Gold on black, never red: red already means
   an alliance on every other screen this weekend. */
.emerg-banner { position: sticky; top: 0; z-index: 50; display: grid; gap: 6px;
  background: var(--cg-gold); color: var(--cg-black);
  clip-path: var(--chamfer); --ch: 14px; padding: 14px 18px; }
.emerg-banner[hidden] { display: none; }
.emerg-banner b { font-family: var(--font-cond); font-weight: 700; font-size: 15px;
  letter-spacing: .2em; text-transform: uppercase; }
.emerg-banner .emerg-msg { font-family: var(--font-display); font-weight: 800;
  font-size: 22px; line-height: 1.2; overflow-wrap: anywhere; }
.emerg-banner .emerg-detail { font-family: var(--font-cond); font-weight: 600;
  font-size: 17px; line-height: 1.25; overflow-wrap: anywhere; }
/* Read from across a pit, when /s/watch mounts this page as a kiosk. */
:root[data-kiosk="1"] .emerg-banner { padding: 24px 32px; gap: 12px; --ch: 20px; }
:root[data-kiosk="1"] .emerg-banner b { font-size: 34px; }
:root[data-kiosk="1"] .emerg-banner .emerg-msg { font-size: 56px; }
:root[data-kiosk="1"] .emerg-banner .emerg-detail { font-size: 34px; }
</style>
</head>
<body>
  <!-- Safety message, from state.emergency. Hidden until the desk raises one,
       and hidden again when a human clears it. role=alert so a screen reader
       says it the moment it appears. -->
  <div class="emerg-banner" id="emerg" hidden role="alert">
    <b id="emergKind"></b>
    <div class="emerg-msg" id="emergMsg"></div>
    <div class="emerg-detail" id="emergDetail"></div>
  </div>
  <div>
    <h1>When do we play?</h1>
    <div class="tick" aria-hidden="true"></div>
  </div>
  <div class="sub" id="now" aria-live="polite">connecting...</div>

  <!-- A real form, so Enter and the phone keyboard's go key follow too. -->
  <form class="card" id="follow">
    <label for="team">Your team number</label>
    <div class="row">
      <!-- No pattern="[0-9]*": a second robot is followed by its label (100B),
           and a pattern the label fails stops the form submitting at all.
           inputmode and the placeholder are set from the event's team list in
           paint(): the number pad stays for an event with no second robots,
           and swaps to the full keyboard where somebody needs a letter. -->
      <input id="team" inputmode="numeric" autocapitalize="characters" autocomplete="off"
             autocorrect="off" spellcheck="false" placeholder="846">
      <button class="btn-go" id="go" type="submit">Follow</button>
    </div>
  </form>
  <p class="hintline" id="followNote" role="status" hidden></p>

  <div class="rankline" id="rank" hidden aria-live="polite"></div>
  <div id="list"></div>
  <!-- Only while the list above is Nexus's. Their API asks for the link back,
       and they are volunteers handing out free API keys. -->
  <p class="queue-credit" id="queueCredit" hidden>Queue times from
    <a href="https://frc.nexus" target="_blank" rel="noopener">frc.nexus</a></p>
  <!-- The most-asked question after an event, answered during it: where is the
       video of the match we just played. -->
  <div id="played" hidden>
    <h2 class="playedhead">Your matches so far</h2>
    <div id="playedList"></div>
  </div>
  <!-- Findable rather than announced: the person who needs this is deciding
       now, in a loud building, on the phone already in their hand. -->
  <div id="access" hidden>
    <h2 class="playedhead">Around the building</h2>
    <div id="accessList"></div>
  </div>

  <p class="hintline" id="note">Times marked ~ are estimates from how fast matches are
    actually cycling, not the printed schedule.</p>

<script type="module">
import { teamLabel, teamPit, teamFromInput } from '/shared/desk-client.js';

const $ = id => document.getElementById(id);
// Room scale when /s/watch mounts this on a pit monitor. See the
// :root[data-kiosk="1"] block above; on a phone this attribute is never set.
if (new URLSearchParams(location.search).get('kiosk') === '1') {
  document.documentElement.dataset.kiosk = '1';
}
// The 5s poll below repaints every cycle whether or not anything changed.
// Guard the aria-live regions with these so a screen reader announces a
// real change, not the same status line every 5 seconds.
const setText = (el, text) => { if (el.textContent !== text) el.textContent = text; };
const setHTML = (el, html) => { if (el.innerHTML !== html) el.innerHTML = html; };
// The followed team is always the NUMBER (it is what every lookup, the
// remembered value and /api/coverage/team/:n key on). The label a person types
// and reads (100B) is display only, turned back into a number on the way in by
// teamFromInput and back into a label on the way out by teamLabel.
let team = Number(localStorage.getItem('next.team')) || null;
// The latest /api/state, so the follow form can read "100B" against the same
// team list the page is painting from.
let lastState = null;
// The input is relabelled from state once, not on every poll, so a half-typed
// number is never overwritten by the one being followed.
let labelled = false;

/**
 * What this team has already played, and the video if there is one.
 *
 * Read from the coverage ledger rather than the publish queue: the queue knows
 * what it was asked to make, and a team asking "where is our match" needs the
 * answer even when the answer is "it has not been cut yet".
 */
async function loadPlayed() {
  const box = $('played');
  if (!team) { box.hidden = true; return; }
  try {
    const res = await fetch(`/api/coverage/team/${team}`);
    if (!res.ok) { box.hidden = true; return; }
    const { rows } = await res.json();
    const done = (rows ?? []).filter(r => r.playedAt);
    box.hidden = done.length === 0;
    $('playedList').replaceChildren(...done.map(r => {
      const el = document.createElement('div');
      el.className = 'card played-row';
      const name = document.createElement('b');
      name.textContent = r.name;
      el.append(name);
      if (r.score) {
        const sc = document.createElement('span');
        sc.className = 'played-score';
        const mine = r.red.includes(team) ? 'red' : 'blue';
        const won = mine === 'red' ? r.score.red > r.score.blue : r.score.blue > r.score.red;
        sc.textContent = `${r.score.red} - ${r.score.blue}${won ? '  W' : ''}`;
        el.append(sc);
      }
      // A ready-made link, not a raw video id. The route used to hand out the
      // id of videos uploaded UNLISTED and not yet published, which anyone
      // holding the id can watch; it now carries a URL, and only once the
      // video is actually public.
      if (r.video) {
        const a = document.createElement('a');
        a.className = 'played-link';
        a.href = r.video;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = 'Watch';
        el.append(a);
      } else {
        const pending = document.createElement('span');
        pending.className = 'played-pending';
        // Honest rather than encouraging: a team refreshing a page that says
        // "coming soon" all weekend trusts the next thing it says less.
        pending.textContent = 'video not posted yet';
        el.append(pending);
      }
      return el;
    }));
  } catch { box.hidden = true; }
}
if (team) $('team').value = team;
// And load their played matches, which only ever ran from the submit handler.
// A parent who followed their team yesterday reopened the page and the played
// list with its video links (the page's whole post-match feature) simply
// never appeared until they pressed Follow again.
if (team) void loadPlayed();

$('follow').addEventListener('submit', async e => {
  e.preventDefault();
  const typed = $('team').value.trim();
  // "100B" can only be read against the team list, so wait for it if the first
  // poll has not come back yet. A plain number needs nothing and survives an
  // offline phone.
  if (!lastState && typed) await poll();
  team = typed ? teamFromInput(lastState, typed) : null;
  if (team) localStorage.setItem('next.team', String(team));
  else localStorage.removeItem('next.team');
  // Say so when it matched nothing. Silently un-following on a typo (or on
  // "100B" at an event with no such robot) looks exactly like a page that is
  // broken.
  const miss = typed !== '' && team === null;
  $('followNote').hidden = !miss;
  setText($('followNote'), miss ? `Couldn't find "${typed}". Try your team number, like 846.` : '');
  if (team) $('team').value = teamLabel(lastState, team);
  poll();
  void loadPlayed();
});

const clock = ts => new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

// The same labels surfaces/program/program.js and the side screen use, so the
// word on a phone is the word on the wall.
const EMERG_KIND = {
  evacuate: 'Evacuate',
  shelter: 'Shelter in place',
  medical: 'Medical',
  hold: 'Hold',
  allclear: 'All clear',
  custom: 'Announcement',
};
function paintEmergency(e) {
  $('emerg').hidden = !e;
  if (!e) return;
  setText($('emergKind'), EMERG_KIND[e.kind] ?? EMERG_KIND.custom);
  setText($('emergMsg'), e.message);
  setText($('emergDetail'), e.detail ?? '');
  $('emergDetail').hidden = !e.detail;
}

function paintAccess(a) {
  const box = document.getElementById('access');
  const list = a?.services ?? [];
  box.hidden = list.length === 0;
  if (!list.length) return;
  const rows = list.map(sv => {
    const row = document.createElement('div');
    row.className = 'card access-row';
    const label = document.createElement('b');
    label.textContent = sv.label;
    row.append(label);
    if (sv.detail) {
      const d = document.createElement('span');
      d.textContent = sv.detail;
      row.append(d);
    }
    return row;
  });
  if (a.ask) {
    const ask = document.createElement('div');
    ask.className = 'access-ask';
    ask.textContent = a.ask;
    rows.push(ask);
  }
  document.getElementById('accessList').replaceChildren(...rows);
}

/**
 * The on-deck list and where each row sits in time, worked out by the desk
 * (apps/core/src/deck.ts, which holds the reasoning and the tests). `offs[i]`
 * is null for the match on the field; `etas[i]` is the row's estimated start,
 * which already waits out lunch and the night instead of walking with the
 * clock.
 * This page used to count "rows already started" itself, and with a Nexus
 * queue it counted wrong: Nexus drops a match the moment a queuer marks it On
 * field, so every estimate read a cycle early. The fallback is only for a
 * state from a desk too old to send a deck.
 */
const deckOf = s => s.deck ?? {
  rows: s.upcoming ?? [], offs: (s.upcoming ?? []).map((_, i) => i), etas: [],
};

/**
 * The follow form follows the event's team list: the number pad while every
 * team is a plain number, the full keyboard (and an example in the placeholder)
 * once a second robot exists, because 100B cannot be typed on a number pad.
 */
function fitFollowForm(s) {
  const input = $('team');
  const second = Object.values(s.teams ?? {}).find(t => t?.label);
  const mode = second ? 'text' : 'numeric';
  if (input.inputMode !== mode) input.inputMode = mode;
  const hint = second ? `846 or ${second.label}` : '846';
  if (input.placeholder !== hint) input.placeholder = hint;
  if (!labelled) {
    labelled = true;
    // Only if nobody has started typing something else already.
    if (team !== null && input.value === String(team)) input.value = teamLabel(s, team);
  }
}

/**
 * What to say to a followed team that is in none of the matches on the list.
 * `ahead` is the matches still to come: the one already on the field is not
 * "next", so it is not counted in "the next N".
 */
function noMatches(s, ahead) {
  if (ahead > 0) {
    return `Team ${esc(teamLabel(s, team))} is not in the next ${ahead} match${ahead === 1 ? '' : 'es'}. You have time.`;
  }
  return deckOf(s).rows.length
    ? `Team ${esc(teamLabel(s, team))} is not on the field. Nothing is queued behind it yet.`
    : 'Schedule not published yet.';
}

function paint(s) {
  lastState = s;
  // First: the safety message outranks everything below, and it has to be on
  // screen before trimToFit() measures what is left for the match list.
  paintEmergency(s.emergency);
  fitFollowForm(s);
  // The field's own wording first, as the side screens do: two screens in
  // one gym giving different minute figures starts arguments at the scoring
  // table. "On schedule" is not worth saying.
  const behind = s.pace?.behindMin;
  const official = s.pace?.officialLate;
  const behindText = official
    ? (/on schedule/i.test(official) ? '' : ` · ${official}`)
    : behind == null || Math.abs(behind) < 2 ? ''
      : behind > 0 ? ` · ${behind} min behind` : ` · ${-behind} min ahead`;
  // A break card's "back ~2:15" is stamped from the break's scheduled length,
  // and an Awards Break routinely runs over it: past that time the line keeps
  // the message and says "back soon", as the side screens do, rather than
  // promising a time already gone. This repaints on every poll, so it turns
  // over by itself. Judged on the DESK's clock (see deskSkew), as the side
  // screens and the stream are: a pit monitor's own clock can be minutes out,
  // and the same break must not read "back ~2:15" on one screen and "back
  // soon" on the screen beside it.
  const back = s.status?.backAt;
  setText($('now'), s.status
    ? `${s.status.message}${!back ? '' : Date.now() + deskSkew < back ? ` · back ~${clock(back)}` : ' · back soon'}`
    : s.match?.displayName
      ? `Now playing · ${s.match.displayName}${behindText}`
      : 'Waiting for the field');

  paintAccess(s.accessibility);
  // The followed team's header line: who, where they stand, and where to find
  // them. The pit is the part that does not depend on a match having been
  // played, so a team with no ranking yet still gets the line.
  // Two lines, each a block, rather than one long run that wraps wherever the
  // phone happens to be narrow and strands a separator at the end of a line.
  const row = (s.rankings ?? []).find(r => r.team === team);
  const pit = team === null ? null : teamPit(s, team);
  const head = [];
  if (team !== null) {
    head.push(`<span>Team <b>${esc(teamLabel(s, team))}</b>${pit ? ` · Pit <b>${esc(pit)}</b>` : ''}</span>`);
  }
  if (row) head.push(
    // Average RP, which is what the ranking is ordered on: the raw total
    // disagrees with the rank order once teams have played unequal numbers of
    // matches, which is routine at an offseason.
    `<span>Rank <b>${row.rank}</b> · ${esc(row.record)} · ${(row.avgRp ?? 0).toFixed(1)} RP/match</span>`);
  $('rank').hidden = head.length === 0;
  if (head.length) setHTML($('rank'), head.join(''));

  // Each row's estimate, as the desk projected it. With no pace yet, the
  // row's own time (the printed schedule, or the queuers' estimate under
  // Nexus).
  const deck = deckOf(s);
  const eta = i => deck.offs[i] === null
    ? 'On field now'
    : deck.etas?.[i] != null
      ? `~${clock(deck.etas[i])}`
      : (deck.rows[i]?.time ? clock(Date.parse(deck.rows[i].time)) : '');

  const chip = (n, cls) =>
    `<span class="${cls}${n === team ? ' mine' : ''}">${esc(teamLabel(s, n))}</span>`;

  // Following a team means their matches, not a scroll of everyone else's.
  // With nobody following, show what actually fits: `trimToFit()` drops from
  // the bottom until the page stops scrolling, so the phone and the laptop
  // each get as many as their screen holds.
  const all = deck.rows;
  $('queueCredit').hidden = s.queueFrom !== 'nexus';
  const isMine = m => team !== null && (m.red.includes(team) || m.blue.includes(team));

  // Keep each match's place in the deck. Its estimate belongs to that place,
  // so filtering to one team and then counting from zero would promise every
  // match the next slot.
  const shown = all
    .map((m, queuePos) => ({ m, queuePos }))
    .filter(({ m }) => team === null || isMine(m));

  $('list').innerHTML = shown.map(({ m, queuePos }) => {
    const yours = isMine(m);
    const side = !yours ? '' : m.red.includes(team) ? 'Red alliance' : 'Blue alliance';
    return `
      <div class="m" data-mine="${yours}">
        <span class="m-name num">${esc(m.shortName || m.name)}</span>
        <span class="m-side">${side}</span>
        <span class="m-eta"${deck.offs[queuePos] === null ? ' data-field' : ''}>${eta(queuePos)}</span>
        <span class="m-teams">${m.red.map(n => chip(n, 'r')).join('')}<span class="al-sep" aria-hidden="true"></span>${m.blue.map(n => chip(n, 'b')).join('')}</span>
      </div>`;
  }).join('') || `<p class="hintline">${noMatches(s, deck.offs.filter(o => o !== null).length)}</p>`;

  if (team === null) trimToFit();
}

const esc = x => String(x ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

/**
 * Drop matches off the bottom until the page stops scrolling.
 *
 * Only when nobody is following a team. Someone who typed their number wants
 * all of their matches, however many that is; someone who just opened the
 * page wants a glance, and a glance should not scroll.
 */
function trimToFit() {
  const cards = () => [...document.querySelectorAll('#list .m')];
  let guard = 40;
  while (guard-- > 0 && cards().length > 1
      && document.documentElement.scrollHeight > window.innerHeight) {
    cards().at(-1).remove();
  }
}

/**
 * How far the desk's clock is ahead of this device's, from the Date header on
 * each poll. Venue machines are not NTP-disciplined; a second's precision is
 * plenty for a line that turns over by the minute.
 */
let deskSkew = 0;
async function poll() {
  try {
    const res = await fetch('/api/state');
    const at = Date.parse(res.headers?.get?.('date') ?? '');
    if (Number.isFinite(at)) deskSkew = at - Date.now();
    paint(await res.json());
  } catch { setText($('now'), 'reconnecting...'); }
}
setInterval(poll, 5000);
poll();

// The played list refreshes on its own timer, and a slower one: it changes
// when a video finishes uploading, which is minutes, not seconds. Without
// this a video posted while somebody had the page open never showed up.
setInterval(() => { if (team) void loadPlayed(); }, 60_000);
</script>
</body>
</html>
