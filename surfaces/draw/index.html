<!doctype html>
<!-- data-surface="console" because this IS a console: nav.js lists it in
     CONSOLES and the page mounts the strip. Without the attribute the strip
     injected here fell through to the :root broadcast tokens and painted
     brand purple (--surface-raised resolving to --cg-purple-hi #7B2394)
     where the same strip is near-black on the other eight, and --btn-hover
     fell back to that identical purple, so hovering a nav link made it
     disappear into the bar behind it. It also put this page outside the
     reduced-motion block in tokens.css, which is scoped to console surfaces:
     the tool transitions and the :active press-scale kept animating for an
     analyst who had asked their OS for less motion, on the one surface in
     the fleet where that was ignored.
     data-key stays: applyDisplayMode() rewrites it from ?key=. -->
<html lang="en" data-surface="console" data-key="alpha">
<head>
<meta charset="utf-8">
<!-- No zoom lock: pinch-during-stroke is already handled by touch-action:
     none on the canvas, and locking scale breaks low-vision zoom (WCAG
     1.4.4). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Telestrator pad · CalGames 2026</title>
<link rel="stylesheet" href="/theme/tokens.css">
<link rel="stylesheet" href="/shared/fonts.css">
<style>
/* Tablet surface. Dark, because the analyst is sitting in a dim broadcast
   position and a white UI at arm's length is blinding. Big targets. This is
   driven with a stylus and a thumb, standing up, under time pressure.

   The dark field itself comes from the console surface in tokens.css now,
   which paints it on the ROOT and keeps the body transparent. This page used
   to hand-roll its own purple-void fill with the broadcast atmosphere glow
   over it; almost none of it was ever visible, because a letterboxed 16:9
   pad and a full-width toolbar leave only a sliver of page showing, and the
   local copy was the reason the page had drifted out of the console surface
   in the first place. */
html, body { height: 100%; overscroll-behavior: none; }
body {
  display: flex; flex-direction: column;
  touch-action: none; -webkit-user-select: none; user-select: none;
}

/* 16:9 pad, letterboxed to match the program's aspect, so a circle drawn here
   lands as a circle on air. */
#pad {
  flex: 1; min-height: 0; position: relative;
  display: grid; place-items: center; padding: 10px;
}
/* Sized in JS: see layout(). An aspect-ratio box with no definite width or
   height collapses to zero here, because the only child is absolutely
   positioned so there's nothing to derive an intrinsic size from. Computing
   the largest 16:9 rect that fits is deterministic and avoids the CSS edge
   cases entirely, which is what you want in a broadcast tool. */
#frameBox {
  position: relative;
  background: var(--cg-black);
  box-shadow: inset 0 0 0 3px var(--cg-gold-lo);
  overflow: hidden;
}
#frameImg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
#ink { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

#noFrame {
  /* place-CONTENT, not place-items: with two lines inside, items-centering
     stretches each into its own row and scatters them across the pad. */
  position: absolute; inset: 0; display: grid; place-content: center; text-align: center;
  color: var(--cg-white-dim); font-family: var(--font-cond); font-size: 17px;
  /* Tracking adds a trailing space to every glyph, so centered tracked text
     sits half a track left of center; the indent puts it back. */
  letter-spacing: .1em; text-indent: .1em; text-transform: uppercase; padding: 24px; line-height: 1.8;
}
#noFrame[hidden] { display: none; }

/* Visually hidden but present for a screen reader: the page has no visible
   heading, since the toolbar labels already say what everything does. */
.vh { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }

/* toolbar: centered under the pad; the analyst stands mid-screen, and a
   left-hugging toolbar reads as clutter on any camera that catches the pad. */
#bar { position: relative; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  justify-content: center;
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  background: var(--cg-purple-deep); border-top: var(--rule); }
.grp { display: flex; gap: 6px; }
.sep { width: 1px; align-self: stretch; background: var(--cg-purple-hi); margin: 0 4px; }

.tool {
  min-width: 74px; padding: 13px 12px; border: 0; cursor: pointer;
  background: var(--cg-purple); color: var(--cg-white);
  clip-path: var(--chamfer); --ch: 9px;
  font-family: var(--font-cond); font-weight: 700; font-size: 13px;
  /* Tracking adds a trailing space to every glyph, so centered tracked text
     sits half a track left of center; the indent puts it back. */
  letter-spacing: .1em; text-indent: .1em; text-transform: uppercase;
  transition: background var(--dur-tap) linear, transform var(--dur-tap) var(--ease-pop);
}
.tool:active { transform: scale(.94); }
.tool[aria-pressed="true"] { background: var(--cg-gold); color: var(--cg-black); }
.tool small { display: block; font-size: 13px; opacity: .55; letter-spacing: .06em; text-indent: .06em; }
/* Black at .55 over the gold pressed face is under AA; the purple faces pass. */
.tool[aria-pressed="true"] small { opacity: .8; }

.ink { width: 44px; height: 44px; border: 0; cursor: pointer; padding: 0;
  clip-path: var(--chamfer); --ch: 7px; box-shadow: inset 0 0 0 3px transparent; }
/* Two-tone ring: a plain white ring was invisible on the white "note" swatch,
   so the analyst could not tell which ink was active. */
.ink[aria-pressed="true"] { box-shadow: inset 0 0 0 3px var(--cg-black), inset 0 0 0 6px var(--cg-white); }
/* Inset: all three are chamfer-clipped, and an outset ring clips to nothing.
   The :root prefix is load-bearing, not decoration. tokens.css gives every
   operator surface a blanket `:root[data-surface="console"] :focus-visible`
   with a +2px offset, which outweighs a plain `.tool:focus-visible` by one
   selector: on a clip-path'd button that ring paints nothing at all, so the
   pad's three control types would have had no visible focus. Matching that
   rule's weight, later in the cascade, is what keeps the ring inside the
   shape. */
:root .tool:focus-visible, :root .ink:focus-visible, :root .tag:focus-visible {
  outline: 3px solid var(--focus-ring); outline-offset: -3px;
}

/* Link state: a quiet dot in the corner, not a labeled readout. Spectators
   glancing at the pad shouldn't be reading production plumbing. The word only
   appears when something is WRONG. */
/* A normal flex item at the end of the bar, NOT absolutely positioned over
   it: once team tags wrapped the toolbar to two rows, the absolute version
   floated mid-bar and painted the signed-out warning across the ink swatches,
   illegible exactly when it mattered most. */
#status { margin-left: auto;
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-mono); font-size: 12px; color: var(--cg-white-dim); opacity: .5; }
/* Only the healthy state is dimmed. When the link is down the word is the
   whole point, and at half opacity it fell below AA contrast on this bar. */
#status:has(.dot:not([data-up="true"])) { opacity: 1; }
#status .dot[data-up="true"] + #statusText { display: none; }
.dot { width: 8px; height: 8px; clip-path: var(--chamfer); --ch: 3px; background: var(--st-bad); }
.dot[data-up="true"] { background: var(--st-ok); }

#tags { display: flex; align-items: center; gap: 6px; }
.tag { padding: 13px 14px; border: 0; cursor: pointer;
  background: var(--cg-purple-hi); color: var(--cg-white);
  clip-path: var(--chamfer); --ch: 7px;
  font-family: var(--font-num); font-weight: 900; font-size: 15px; }
.tag[data-alliance="red"] { box-shadow: inset 0 -4px 0 var(--alliance-red); }
.tag[data-alliance="blue"] { box-shadow: inset 0 -4px 0 var(--alliance-blue); }
.tag[aria-pressed="true"] { background: var(--cg-gold); color: var(--cg-black); }
</style>
</head>
<body>
<h1 class="vh">Telestrator pad</h1>

<div id="pad">
  <div id="frameBox">
    <img id="frameImg" alt="" hidden>
    <div id="noFrame"><span>No frozen frame</span><span style="opacity:.6;font-size:14px">
      Draw anyway, or ask replay to send a frame ("Send frame to analyst" on the Replay console)</span></div>
    <canvas id="ink"></canvas>
  </div>
</div>

<div id="bar">
  <!-- A title on every tool, because these five words ARE the page's entire
       instruction set: there is no visible heading and no helper text (see
       the .vh comment above), and the buttons are nouns. "Pen", "Arrow" and
       "Circle" carry themselves; "Spot" and "Path" say nothing at all to an
       analyst picking the tablet up for the first time, and the dimmed
       keyboard letter under each one reads as part of the name ("Path R").
       The <small> stays a separate line and the title says what happens. -->
  <div class="grp" id="tools">
    <button class="tool" data-tool="pen" aria-pressed="true"
            title="Pen: freehand ink, exactly where you draw">Pen<small>P</small></button>
    <button class="tool" data-tool="arrow"
            title="Arrow: drag from where you start to what you are pointing at">Arrow<small>A</small></button>
    <button class="tool" data-tool="ellipse"
            title="Circle: ring a robot or a patch of field">Circle<small>E</small></button>
    <button class="tool" data-tool="spotlight"
            title="Spotlight: dim the whole frame except what you circle">Spot<small>S</small></button>
    <button class="tool" data-tool="path"
            title="Path: an animated dashed route, for showing where something went">Path<small>R</small></button>
  </div>

  <div class="sep"></div>
  <div class="grp" id="inks"></div>

  <div class="sep"></div>
  <div id="tags"></div>

  <div class="sep"></div>
  <div class="grp">
    <button class="tool" id="undo">Undo<small>Z</small></button>
    <button class="tool" id="clear">Clear<small>C</small></button>
    <button class="tool" id="hide" aria-pressed="false">Hide<small>H</small></button>
  </div>

  <div id="status" aria-live="polite"><span class="dot" id="dot" aria-hidden="true"></span><span id="statusText">connecting</span></div>
</div>

<script type="module">
import { mountNav } from '/shared/nav.js';
// screens:false because this is a stylus tablet used standing up, and the nav
// strip's program takes sat exactly where a hand reaches for the Pen tool.
// One brush of a knuckle took the broadcast to Blank mid-match. The talent
// and ref pages already mount without takes for the same reason.
mountNav('draw', { screens: false });
import { connect, applyDisplayMode, startTicker } from '/shared/desk-client.js';
import { StrokeBook, render } from '/shared/telestrator.js';

applyDisplayMode();
const $ = id => document.getElementById(id);
const desk = connect('draw');

const canvas = $('ink');
const ctx = canvas.getContext('2d');
const book = new StrokeBook();
// Debug handle so the pad can be driven and inspected from a console during
// rehearsal, and by the test harness.
window.__tele = { book, desk };

let tool = 'pen';
let ink = 'gold';
let tagTeam = null;

// ---- layout: largest 16:9 box that fits, then back the canvas at device res
// 16:9 matters. A circle drawn on a differently-shaped pad lands as an
// ellipse on air.
const pad = $('pad');
const frameBox = $('frameBox');

function layout() {
  const style = getComputedStyle(pad);
  const padX = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
  const padY = parseFloat(style.paddingTop) + parseFloat(style.paddingBottom);
  const availW = Math.max(0, pad.clientWidth - padX);
  const availH = Math.max(0, pad.clientHeight - padY);
  const w = Math.min(availW, availH * (16 / 9));
  const h = w * (9 / 16);
  frameBox.style.width = `${Math.round(w)}px`;
  frameBox.style.height = `${Math.round(h)}px`;

  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, Math.round(w * dpr));
  canvas.height = Math.max(1, Math.round(h * dpr));
}
new ResizeObserver(layout).observe(pad);
addEventListener('resize', layout);
layout();

// ---- ink swatches ---------------------------------------------------------
// Third column: what a PERSON is told. The ids are the renderer's and the
// archive's vocabulary, and 'good' and 'note' name nothing an analyst would
// recognise; they were going out raw to both the tooltip and the screen
// reader, on swatches that are otherwise colour and nothing else.
const INK_SWATCHES = [
  ['gold', '--cg-gold', 'Gold ink, the default'],
  ['good', '--cg-green-hi', 'Green ink, for a good play'],
  ['note', '--cg-white', 'White ink, for a note'],
  ['red', '--alliance-red', 'Red alliance ink'],
  ['blue', '--alliance-blue', 'Blue alliance ink'],
];
$('inks').innerHTML = INK_SWATCHES.map(([id, v, name]) =>
  `<button class="ink" data-ink="${id}" style="background:var(${v})" aria-pressed="${id === 'gold'}" aria-label="${name}" title="${name}"></button>`).join('');

// ---- stroke transport -----------------------------------------------------
// Points are batched and flushed once per frame. A Pencil reports at 120Hz;
// relaying every sample would be 4x the messages for no visible gain.
let pending = null;
let seq = 0;

const relay = m => desk.relay('tele', m);

function flush() {
  if (pending && pending.pts.length) {
    relay({ k: 'pts', id: pending.id, pts: pending.pts });
    pending.pts = [];
  }
}

function pointFrom(e) {
  const r = canvas.getBoundingClientRect();
  return [
    Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)),
    Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)),
  ];
}

let active = null;

canvas.addEventListener('pointerdown', e => {
  if (e.button !== undefined && e.button !== 0) return;

  // One stroke at a time, owned by the pointer that started it. A palm or
  // second finger landing mid-stroke (touch-action: none invites both) used
  // to run this handler again and overwrite the slot: the first stroke never
  // got its 'end', so it sat at full alpha on the pad AND on air until Clear
  // (prune keeps unfinished strokes and undo skips them), while both contacts
  // scribbled into the new stroke until the first lift ended it early. Not
  // isPrimary: a palm is the primary TOUCH while the pen draws, so ownership
  // has to be by pointerId.
  if (active) return;

  // Capture keeps events flowing if the stylus leaves the canvas mid-stroke.
  // It is an optimization, not a requirement, and it throws NotFoundError if
  // the pointer is no longer active by the time we get here. Letting that
  // escape would abort the handler and silently drop the whole stroke, so the
  // analyst would draw and nothing would appear. Never worth failing over.
  try { canvas.setPointerCapture(e.pointerId); } catch { /* draw anyway */ }

  const id = `s${Date.now().toString(36)}${seq++}`;
  const width = e.pressure > 0 && e.pointerType === 'pen'
    ? Math.round(4 + e.pressure * 8)   // stylus pressure -> stroke width
    // From the token, so the pad and the shared renderer agree on one number.
    : parseFloat(getComputedStyle(document.documentElement)
        .getPropertyValue('--ink-width')) || 7;

  const init = { k: 'begin', id, tool, ink, width };
  book.begin(init);
  relay(init);

  if (tool === 'tag' && tagTeam) {
    book.meta(id, { team: tagTeam });
    relay({ k: 'meta', id, meta: { team: tagTeam } });
  }

  active = { id, pointerId: e.pointerId };
  pending = { id, pts: [] };
  addPoint(e);
});

function addPoint(e) {
  if (!active) return;
  // coalesced events keep fast strokes smooth without raising message rate
  const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (events.length ? events : [e])) {
    const p = pointFrom(ev);
    book.append(active.id, [p]);
    pending.pts.push(p);
  }
}

// Only the owning pointer feeds the stroke: a second contact's moves used to
// splice into it, relaying a zigzag jumping between the two touch points.
canvas.addEventListener('pointermove', e => {
  if (active && e.pointerId === active.pointerId) addPoint(e);
});

function finish() {
  if (!active) return;
  flush();
  const stroke = book.end(active.id);
  relay({ k: 'end', id: active.id });

  // The durable record: one event per finished stroke, not one per sample.
  // Enough to reconstruct the annotation for a post-match card or the archive.
  if (stroke) {
    desk.emit({
      type: 'telestrator.stroke',
      payload: {
        id: stroke.id, tool: stroke.tool, ink: stroke.ink,
        width: stroke.width, meta: stroke.meta,
        pts: stroke.pts.map(([x, y]) => [Math.round(x * 1e4) / 1e4, Math.round(y * 1e4) / 1e4]),
      },
    });
  }
  active = null;
  pending = null;
}
for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) {
  // And only the owning pointer ends it: a palm lifting off the glass must
  // not cut the stylus stroke off mid-draw.
  canvas.addEventListener(ev, e => {
    if (active && e.pointerId === active.pointerId) finish();
  });
}

// ---- toolbar --------------------------------------------------------------
/**
 * One place decides what is selected. The tag tool has no toolbar button:
 * it is selected by picking a team, so `tagTeam` is set first and setTool
 * reads it rather than clearing it.
 */
function setTool(t) {
  tool = t;
  if (t !== 'tag') tagTeam = null;
  for (const b of document.querySelectorAll('[data-tool]')) {
    b.setAttribute('aria-pressed', String(b.dataset.tool === t));
  }
  for (const b of document.querySelectorAll('.tag')) {
    b.setAttribute('aria-pressed', String(t === 'tag' && Number(b.dataset.team) === tagTeam));
  }
}
for (const b of document.querySelectorAll('[data-tool]')) {
  b.onclick = () => setTool(b.dataset.tool);
}
for (const b of document.querySelectorAll('[data-ink]')) {
  b.onclick = () => {
    ink = b.dataset.ink;
    for (const o of document.querySelectorAll('[data-ink]')) {
      o.setAttribute('aria-pressed', String(o.dataset.ink === ink));
    }
  };
}

// The relay repaints the render surface; the emit is the durable record. The
// archive keeps one telestrator.stroke per finished stroke, and without the
// matching undo event a replayed log re-drew strokes the analyst had deleted
// on air. (This was also the only reason the declared telestrator.undo event
// type existed with nothing ever emitting it.)
const doUndo = () => {
  book.undo();
  relay({ k: 'undo' });
  desk.emit({ type: 'telestrator.undo' });
};
const doClear = () => { book.clear(); relay({ k: 'clear' }); desk.emit({ type: 'telestrator.clear' }); };
// Hide is a toggle. The reducer's only path back to hidden:false is a
// telestrator.frame emit, so a one-way Hide stranded the analyst drawing into
// a blanked render with no way back from the pad. Re-emitting the current
// frame (even null) unhides without changing what is frozen.
const doHide = () => {
  const tele = desk.state?.telestrator;
  if (tele?.hidden) desk.emit({ type: 'telestrator.frame', payload: { frame: tele.frame ?? null } });
  else desk.emit({ type: 'telestrator.hide' });
};
$('undo').onclick = doUndo;
$('clear').onclick = doClear;
$('hide').onclick = doHide;

// ---- team tags, built from the loaded match --------------------------------
function buildTags(state) {
  const red = state?.match?.red ?? [];
  const blue = state?.match?.blue ?? [];
  const tagBtn = (t, side) =>
    `<button class="tag" data-alliance="${side}" data-team="${t.number}" aria-label="Team ${t.number}, ${side} alliance">${t.number}</button>`;
  // The gap between the two groups is a real divider, not just a color
  // change: alliance-only-by-color is the one thing this palette can't do.
  $('tags').innerHTML = red.map(t => tagBtn(t, 'red')).join('')
    + (red.length && blue.length ? '<span class="sep"></span>' : '')
    + blue.map(t => tagBtn(t, 'blue')).join('');
  for (const b of document.querySelectorAll('.tag')) {
    b.onclick = () => { tagTeam = Number(b.dataset.team); setTool('tag'); };
  }
}

// ---- frozen frame ----------------------------------------------------------
let lastFrame;
desk.on('state', s => {
  const frame = s.telestrator?.frame ?? null;
  if (frame !== lastFrame) {
    lastFrame = frame;
    const img = $('frameImg');
    img.hidden = !frame;
    $('noFrame').hidden = !!frame;
    if (frame) img.src = frame;
  }
  if ((s.match?.id ?? null) !== buildTags.lastMatch) {
    buildTags.lastMatch = s.match?.id ?? null;
    buildTags(s);
  }
  // The pad keeps drawing locally while the render is blanked, so the button
  // is the only place the analyst can see the output is hidden.
  const hidden = !!s.telestrator?.hidden;
  if (String(hidden) !== $('hide').getAttribute('aria-pressed')) {
    $('hide').setAttribute('aria-pressed', String(hidden));
    $('hide').innerHTML = hidden ? 'Hidden<small>H</small>' : 'Hide<small>H</small>';
  }
});

// Strokes are write traffic. After a desk restart or an expired cookie the
// socket reconnects read-only: every relay is rejected and the analyst would
// draw into the void behind a green dot. Latch the failure; the only way back
// is a reload through /signin.
let signedOut = false;
function markSignedOut() {
  signedOut = true;
  $('dot').dataset.up = 'false';
  $('statusText').textContent = 'signed out: reload this page to sign in again';
}
desk.on('denied', markSignedOut);
// The server only says 'denied' once a stroke is actually sent, so ask it
// directly on every reconnect instead of waiting for ink to vanish on air.
async function checkSession() {
  try {
    const status = await fetch('/api/auth/status').then(r => r.json());
    if (status.required && !status.authed) markSignedOut();
  } catch { /* transient; the denied latch still covers it */ }
}
desk.on('link', up => {
  if (signedOut) return;
  $('dot').dataset.up = String(up);
  $('statusText').textContent = up ? 'linked' : 'reconnecting...';
  if (up) {
    checkSession();
    // If the socket dropped mid-stroke, tele's copy of that stroke is still
    // open: it never got the 'end' and would sit at full alpha until Clear.
    // Close out anything the pad has already finished locally.
    for (const s of book.strokes) {
      if (s.done) relay({ k: 'end', id: s.id });
    }
  }
});

// ---- render loop -----------------------------------------------------------
const fadeMs = () => parseFloat(getComputedStyle(document.documentElement)
  .getPropertyValue('--ink-fade')) || 6000;

startTicker(() => {
  flush();
  book.prune(fadeMs());
  render(ctx, book, { fadeMs: fadeMs() });
});

// ---- keyboard (for a laptop fallback; the tablet uses the toolbar) ---------
const KEYS = { p: 'pen', a: 'arrow', e: 'ellipse', s: 'spotlight', r: 'path' };
addEventListener('keydown', e => {
  // Bare keys only: a reflexive Ctrl+C (copy) or Cmd+H (hide the browser)
  // must never wipe or blank the on-air drawing.
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (KEYS[k]) { setTool(KEYS[k]); return; }
  if (k === 'z') doUndo();
  if (k === 'c') doClear();
  if (k === 'h') doHide();
});
</script>
</body>
</html>
