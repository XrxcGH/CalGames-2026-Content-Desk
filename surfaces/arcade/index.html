<!doctype html>
<html lang="en" data-key="alpha">
<head>
<meta charset="utf-8">
<title>Arcade overlay · CalGames 2026</title>
<link rel="stylesheet" href="/theme/tokens.css">
<link rel="stylesheet" href="/shared/fonts.css">
<link rel="stylesheet" href="/shared/broadcast.css">
<style>
/* Same component vocabulary as the match overlay: panel, chip, numeral block.
   Player sides use purple and green, NOT alliance red/blue: those mean FRC
   alliance on this broadcast and nowhere else, and borrowing them here would
   quietly poison the association we spend all weekend building. */
/* Strip height, shared: the round tab and the hanging panels key off it, so
   the four stay in step if it ever changes. 120px because this surface is on
   air and its type holds the 28px broadcast floor (tokens.css): the old
   76px strip predates the floor, and the tallest stack (round line over the
   game chip, measured 116px) has to clear it or the strip grows out from
   under everything anchored below. */
:root { --strip-h: 120px; }
/* The set card runs across the TOP of the frame, not the bottom: Mario Kart
   and Smash both draw their own HUD (coins, lap, position, damage) along the
   bottom of the capture, and covering it referees the game blind. */
.ar-card {
  position: absolute; left: 0; right: 0; top: 0;
  /* 420px center: at the 28px floor the game chip ("Super Smash Bros.") and
     a real round name both wrapped inside the old 300, doubling the strip's
     height and driving it into the GP panel hanging below. */
  display: grid; grid-template-columns: 1fr 420px 1fr;
  background-color: var(--cg-purple);
  background-image: var(--tex-perf);
  background-size: var(--tex-perf-size);
  border-bottom: var(--rule);
  min-height: var(--strip-h);
}

.ar-side { display: flex; align-items: center; gap: 16px; padding: 6px 20px; }
.ar-side--p2 { flex-direction: row-reverse; text-align: right; }
.ar-side--p1 { background: var(--cg-purple); border-right: var(--rule); }
.ar-side--p2 { background: var(--cg-green-lo); border-left: var(--rule); }
/* min-width: 0 lets the text column actually shrink inside the flex row;
   without it a long name refuses to clamp and pushes the score off the edge. */
.ar-side > div:first-child { min-width: 0; }
.ar-side--p2 > div:first-child { min-width: 0; }

/* The GP panel, the up-next chip, and the round tab all hang off --strip-h,
   so NOTHING in the strip may grow it: a wrapped long name used to add a
   line, push the strip past its height, and slide it under all three. Names
   clamp to two lines, the team line to one, and the ellipsis takes the rest. */
.ar-name {
  font-family: var(--font-display); font-weight: 800; font-size: 28px;
  font-variation-settings: "wdth" var(--wdth-display); line-height: 1.02;
  overflow-wrap: break-word;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
.ar-team {
  margin-top: 4px;
  font-family: var(--font-cond); font-weight: 600; font-size: 28px;
  letter-spacing: .1em; text-transform: uppercase; color: var(--cg-gold);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
}
.ar-score {
  font-family: var(--font-num); font-variant-numeric: tabular-nums;
  font-weight: 900; font-size: 46px; line-height: 1;
  color: var(--cg-white); letter-spacing: -.04em; margin-left: auto;
}
.ar-side--p2 .ar-score { margin-left: 0; margin-right: auto; }
/* Unconfirmed scores render outlined, exactly like an estimated match score. */
.ar-score[data-est="true"] { color: transparent; -webkit-text-stroke: 3px var(--cg-white); }

.ar-mid { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 6px; min-width: 0; }
.ar-round {
  font-family: var(--font-cond); font-weight: 700; font-size: 28px;
  letter-spacing: .16em; text-indent: .16em; text-transform: uppercase; color: var(--cg-gold); text-align: center;
  /* One line, always: the GP panel and the round tab hang off --strip-h, so
     a wrapped round would grow the strip out from under them. An extreme
     round name ends on the ellipsis instead. */
  max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* .ar-game keeps the chip defaults: 28px is the floor, and the chip already
   sits there. */

/* ---- Mario Kart standings ---- */
.gp {
  /* Hangs below the top strip, clear of the round tab. Right edge, where it
     covers the least of the racing line, never the bottom HUD text. 520px
     wide: the rows run at the 28px broadcast floor (this overlay is on air,
     and 17px rendered at ~11px on a 720p stream), so names plus points no
     longer fit the old 330. */
  position: absolute; right: 24px; top: calc(var(--strip-h) + 16px); width: 520px;
  background-color: var(--cg-purple);
  background-image: var(--tex-perf); background-size: var(--tex-perf-size);
  clip-path: var(--chamfer); --ch: 12px;
  /* Inline padding clears the chamfer: at --ch 12 a 12px inset would put
     the first and last glyph inside the corner cut. */
  padding: 12px 20px 14px;
}
/* Real filled edge, not box-shadow: shadows die under the luma key. */
.gp::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px;
  background: var(--cg-gold);
}
/* --------------------------------------------------------------------------
   Boxes come and go individually.

   Every box on this overlay is anchored to an edge, so each one LEAVES by its
   own edge rather than fading in place: a panel that slides off the right has
   obviously gone somewhere, while a panel that fades reads for a moment like a
   rendering fault. The two inset boxes fade slightly on the way out as well,
   because their travel is short enough that a pure slide looks abrupt.

   These are transitions on transform and opacity only, so they run on the
   compositor and cost nothing on the machine that is also encoding the stream.
   The [hidden] attribute is deliberately NOT used for these: display:none
   cannot animate, so the operator's hide would snap.
   -------------------------------------------------------------------------- */
.ar-card, .ffa, .ffa-tab, .gp, #upNext {
  transition: transform var(--dur-in) var(--ease-enter),
              opacity var(--dur-in) var(--ease-enter),
              visibility 0s;
}
.ar-card[data-off], .ffa[data-off], .ffa-tab[data-off], .gp[data-off], #upNext[data-off] {
  /* Leaving is quicker than arriving: getting out of the way should feel
     immediate, arriving should not startle. */
  transition: transform var(--dur-out) var(--ease-exit),
              opacity var(--dur-out) var(--ease-exit),
              visibility 0s var(--dur-out);
  visibility: hidden;
}
/* The two full-width strips live on the top edge: straight up and out. */
.ar-card[data-off], .ffa[data-off] { transform: translateY(-100%); }
/* The round tab hangs BELOW its strip, so it has to clear the strip's height
   as well as its own or it would still be on screen after the strip has gone.
   Its resting transform is the centering one, which must be preserved. */
.ffa-tab { transform: translateX(-50%); }
.ffa-tab[data-off] { transform: translate(-50%, calc(-100% - var(--strip-h))); }
/* Inset from the right edge, so it must travel its own width plus the inset. */
.gp[data-off] { transform: translateX(calc(100% + 24px)); opacity: .4; }
/* Inset from the left. */
#upNext[data-off] { transform: translateX(calc(-100% - 24px)); opacity: .4; }

@media (prefers-reduced-motion: reduce) {
  /* docs/08: every transition collapses to a state change. The box still
     leaves, it just stops travelling to get there. */
  .ar-card, .ffa, .ffa-tab, .gp, #upNext { transition: none; }
}
.gp h2 {
  margin: 0 0 8px; font-family: var(--font-cond); font-weight: 700;
  font-size: 28px; letter-spacing: .16em; text-transform: uppercase; color: var(--cg-gold);
}
.gp-row {
  display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: baseline;
  padding: 5px 0; border-bottom: 1px solid var(--cg-purple-hi);
}
.gp-row:last-child { border-bottom: 0; }
.gp-pos { font-family: var(--font-num); font-weight: 900; font-size: 28px; color: var(--cg-gold); }
.gp-name {
  font-family: var(--font-cond); font-weight: 600; font-size: 28px; text-transform: uppercase; letter-spacing: .04em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.gp-pts { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 900; font-size: 28px; }

#upNext {
  position: absolute; left: 24px; top: calc(var(--strip-h) + 20px);
  /* Always laid out, never display:none: it has to be able to slide away, and
     an element that is display:none has nowhere to slide from. */
  display: inline-flex;
}

/* ---- free-for-all: 3-4 players (split-screen Kart, Pac-Man party, Tetris).
       One cell per player across the bar; the round rides in a tab above,
       same gold-shell construction as the hub indicator. ------------------- */
.ffa {
  position: absolute; left: 0; right: 0; top: 0;
  display: grid;
  /* Brand purple, not the near-black deep gradient: the strip must read as
     the same chrome family as the GP panel and the round tab. */
  background-color: var(--cg-purple);
  background-image: var(--tex-perf);
  background-size: var(--tex-perf-size);
  border-bottom: var(--rule);
  min-height: var(--strip-h);
}
.ffa-cell {
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; padding: 6px 14px;
  border-left: var(--rule-thin);
}
.ffa-cell:first-child { border-left: 0; }
/* The current leader carries a filled gold cap, never color alone at 720p. */
.ffa-cell[data-lead="true"]::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px;
  background: var(--cg-gold);
}
/* Each FFA cell sits over that player's split-screen quadrant, top edge. */
.ffa-score {
  font-family: var(--font-num); font-variant-numeric: tabular-nums;
  font-weight: 900; font-size: 38px; line-height: 1;
  color: var(--cg-white); letter-spacing: -.03em;
}
.ffa-score[data-est="true"] { color: transparent; -webkit-text-stroke: 3px var(--cg-white); }
.ffa-name {
  font-family: var(--font-cond); font-weight: 600; font-size: 28px;
  letter-spacing: .06em; text-indent: .06em; text-transform: uppercase; color: var(--cg-white);
  text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
}
.ffa-name b { font-family: var(--font-num); font-weight: 900; color: var(--cg-gold); margin-right: 10px; }

/* Round tab hangs DOWN from the strip. Same gold-shell construction as the
   hub tab, flipped. +3px keeps the strip's gold border unbroken above it. */
.ffa-tab {
  position: absolute; left: 50%; transform: translateX(-50%);
  /* Starts exactly on the strip's outer edge: the strip plus its 3px gold
     border. The tab is itself a gold shell, so meeting the band flush reads as
     one continuous edge. Guessing 6px for that border left a 3px white seam. */
  top: calc(var(--strip-h) + 3px); z-index: 4;
  padding: 6px 24px 10px;
  background: var(--cg-gold);
  --ch: 14px;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - var(--ch)),
                     calc(100% - var(--ch)) 100%, var(--ch) 100%, 0 calc(100% - var(--ch)));
  font-family: var(--font-cond); font-weight: 700; font-size: 28px;
  /* text-indent balances the trailing letter-space so the label centers. */
  letter-spacing: .14em; text-indent: .14em; text-transform: uppercase; color: var(--cg-white);
  white-space: nowrap;
}
.ffa-tab::before {
  content: ""; position: absolute; inset: 0 3px 3px;
  background-color: var(--cg-purple);
  background-image: var(--tex-perf); background-size: var(--tex-perf-size);
  --ch: 12px;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - var(--ch)),
                     calc(100% - var(--ch)) 100%, var(--ch) 100%, 0 calc(100% - var(--ch)));
}
.ffa-tab span { position: relative; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="stageWrap"><div id="stage">

  <div class="gp" id="gp" data-off>
    <h2 id="gpName">Grand Prix</h2>
    <div id="gpRows"></div>
  </div>

  <span class="chip chip--accent" id="upNext" data-off></span>

  <!-- 3-4 player free-for-all -->
  <div class="ffa-tab" id="ffaTab" data-off><span></span></div>
  <div class="ffa" id="ffa" data-off></div>

  <div class="ar-card" id="card" data-off>
    <div class="ar-side ar-side--p1">
      <div>
        <div class="ar-name" id="p1Name">-</div>
        <div class="ar-team" id="p1Team"></div>
      </div>
      <div class="ar-score num" id="p1Score">0</div>
    </div>
    <div class="ar-mid">
      <div class="ar-round" id="round">&nbsp;</div>
      <div class="chip ar-game" id="game">Smash</div>
    </div>
    <div class="ar-side ar-side--p2">
      <div>
        <div class="ar-name" id="p2Name">-</div>
        <div class="ar-team" id="p2Team"></div>
      </div>
      <div class="ar-score num" id="p2Score">0</div>
    </div>
  </div>

  <div id="sweep"></div>
</div></div>

<script type="module">
import { connect, applyDisplayMode, fitStage, roll } from '/shared/desk-client.js';

applyDisplayMode();
const $ = id => document.getElementById(id);
const desk = connect('arcade');

fitStage($('stage'));

const GAME_LABEL = {
  smash: 'Super Smash Bros.', mariokart: 'Mario Kart',
  pacman: 'Pac-Man', tetris: 'Tetris', other: 'Arcade',
};

let snap = null;
const load = async () => {
  // A non-OK response (e.g. this endpoint not open to an unauthenticated
  // overlay) must never reach paint(): parsing an error body as if it were
  // a snapshot would blank out whatever the live WS events already drew.
  try {
    const r = await fetch('/api/arcade');
    if (r.ok) paint(await r.json());
  } catch { /* transient */ }
};

function paint(s) {
  if (!s) return;
  snap = s;

  // ---- live set: versus card for 2, free-for-all strip for 3-4 ----
  const set = s.set;
  const ffa = !!set && set.players.length > 2;
  // A box is on screen when it has something to say AND the operator has left
  // it switched on. Two independent reasons to be off, one attribute: the
  // graphic does not care which one it was, and both animate the same way.
  const boxes = s.boxes ?? { card: true, ffa: true, gp: true, upNext: true };
  const box = (id, wanted) => $(id).toggleAttribute('data-off', !wanted);
  box('card', !!set && !ffa && boxes.card);
  box('ffa', ffa && boxes.ffa);
  box('ffaTab', ffa && boxes.ffa);

  if (set && !ffa) {
    const est = set.scoreConfidence === 'estimated';
    [0, 1].forEach(i => {
      const p = set.players[i];
      $(`p${i + 1}Name`).textContent = p?.name ?? '-';
      // The crossover: entrants registered by FRC team read as the team.
      $(`p${i + 1}Team`).textContent = p?.team
        ? `${p.team}${p.teamName ? ' · ' + p.teamName : ''}`
        : '';
      const el = $(`p${i + 1}Score`);
      el.dataset.est = String(est);
      roll(el, set.scores[i] ?? 0);
    });
    $('round').textContent = set.round ?? '';
    $('game').textContent = GAME_LABEL[set.game] ?? 'Arcade';
  }

  if (ffa) {
    const est = set.scoreConfidence === 'estimated';
    const max = Math.max(...set.scores);
    $('ffa').style.gridTemplateColumns = `repeat(${set.players.length}, 1fr)`;
    $('ffa').innerHTML = set.players.map((p, i) => `
      <div class="ffa-cell" data-lead="${max > 0 && set.scores[i] === max}">
        <div class="ffa-score num" data-est="${est}">${set.scores[i] ?? 0}</div>
        <div class="ffa-name">${p.team ? `<b>${escapeHtml(p.team)}</b>` : ''}${escapeHtml(p.name ?? '-')}</div>
      </div>`).join('');
    $('ffaTab').firstElementChild.textContent =
      `${set.round ? set.round + ' · ' : ''}${GAME_LABEL[set.game] ?? 'Arcade'}`;
  }

  // ---- grand prix standings ----
  const gp = s.gp;
  box('gp', !!gp && boxes.gp);
  if (gp) {
    $('gpName').textContent = `${gp.name} · race ${Math.min(gp.races.length + 1, gp.raceCount)} of ${gp.raceCount}`;
    // Eight rows is as far as the panel can hang at broadcast type before it
    // reaches the game's own HUD along the bottom of the capture.
    $('gpRows').innerHTML = s.standings.slice(0, 8).map((row, i) => `
      <div class="gp-row">
        <span class="gp-pos num">${i + 1}</span>
        <span class="gp-name">${escapeHtml(row.player.name)}${
          // team is operator/start.gg-fed text, same trust level as the name
          // beside it: it goes through the same escape, or it is an on-air
          // HTML injection point.
          row.player.team ? ` <span style="color:var(--cg-gold)">${escapeHtml(row.player.team)}</span>` : ''}</span>
        <span class="gp-pts num">${row.points}</span>
      </div>`).join('');
  }

  box('upNext', !!s.upNext && boxes.upNext);
  // Only rewrite the text while it is on screen: replacing it during the slide
  // out would show the next segment's name flashing past on the way off.
  if (s.upNext) $('upNext').textContent = `Up next · ${s.upNext}`;
}

for (const t of ['arcade.set_start', 'arcade.score', 'arcade.set_end', 'arcade.bracket_updated']) {
  desk.on(t, ev => paint(ev.payload));
}
desk.on('link', up => { if (up) load(); });
load();

// Keeps the overlay honest if an event is missed while the source was hidden:
// OBS pauses hidden Browser Sources, so a set started during a scene we were
// off of would otherwise never appear. A slow re-poll is the whole story.
setInterval(load, 30_000);

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}
</script>
</body>
</html>
